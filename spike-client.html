<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike: Client</title>
<!-- Phase 1a spike. Deliberately ugly. Proves the spine: import a link, tap an
     item, see points, streak and level. Deleted when Phase 2 lands. -->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat { background: #1e293b; border-radius: 8px; padding: 10px 14px; min-width: 84px; }
  .stat b { display: block; font-size: 20px; color: #3b82f6; }
  .stat span { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; }
  .item { display: flex; align-items: center; gap: 10px; background: #1e293b; border-radius: 8px; padding: 11px 13px; margin-bottom: 7px; cursor: pointer; }
  .item.done { background: #14532d; }
  .box { width: 22px; height: 22px; border: 2px solid #475569; border-radius: 5px; flex: 0 0 auto; text-align: center; line-height: 19px; }
  .item.done .box { background: #22c55e; border-color: #22c55e; color: #052e16; }
  .meta { font-size: 11px; color: #94a3b8; }
  .tag { font-size: 10px; background: #334155; border-radius: 4px; padding: 1px 5px; margin-left: 5px; }
  .tag.core { background: #7c2d12; color: #fed7aa; }
  .tag.late { background: #7f1d1d; color: #fecaca; }
  .week { display: flex; gap: 5px; margin: 16px 0; }
  .day { flex: 1; text-align: center; font-size: 10px; padding: 7px 2px; border-radius: 6px; background: #1e293b; }
  .day.closed { background: #14532d; } .day.broken { background: #7f1d1d; } .day.today { outline: 2px solid #3b82f6; }
  button { background: #334155; color: #e2e8f0; border: 0; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
  .err { color: #f87171; }
</style>
</head>
<body>
<div id="app"></div>

<script src="lz-string.min.js"></script>
<script src="beast-core.js"></script>
<script>
var BUILT_AGAINST = '2.0.0';
var KEY = 'bm2.client';
var state = null;

function load() {
  try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); }
  catch (e) { state = null; }
  if (state && !state.log) state.log = {};
  return state;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { /* private mode: keep going in memory */ }
}

function importFromHash() {
  var m = /#import=(.+)$/.exec(location.hash);
  if (!m) return null;
  var res = BeastCore.decodePayload(decodeURIComponent(m[1]));
  if (!res.ok) return res;
  state = {
    items: res.data.items,
    goals: res.data.goals || [],
    profile: res.data.profile || {},
    log: {},
    perfectWeek: BeastCore.perfectWeek(res.data.items),
    earnedLevel: 1
  };
  save();
  history.replaceState(null, '', location.pathname);
  return res;
}

function toggle(id) {
  var today = BeastCore.todayLocal();
  var item = state.items.filter(function (i) { return i.id === id; })[0];
  if (!item) return;
  BeastCore.markDone(state.log, item, today, !BeastCore.isDone(state.log, id, today));
  save();
  render();
}

function render() {
  var app = document.getElementById('app');

  if (BeastCore.VERSION !== BUILT_AGAINST) {
    app.innerHTML = '<p class="err">Beast Mode was updated. Reload this page.</p>';
    return;
  }
  if (!state) {
    app.innerHTML = '<h1>Spike: Client</h1><p class="sub">No plan yet. Open a link from the trainer spike.</p>';
    return;
  }

  var today = BeastCore.todayLocal();
  var p = BeastCore.progress(state.items, state.log, {
    today: today, perfectWeek: state.perfectWeek, earnedLevel: state.earnedLevel
  });
  // Ratchet: once a rank is reached it is never given back.
  if (p.level.level > (state.earnedLevel || 1)) { state.earnedLevel = p.level.level; save(); }

  var html = '<h1>' + BeastCore.escapeHtml(state.profile.name || 'Client') + '</h1>' +
    '<div class="sub">' + today + '</div>' +
    '<div class="stats">' +
      stat(p.points, 'points') + stat(p.streak, 'streak') +
      stat(p.level.rank, 'rank') + stat(p.perfectWeek, 'perfect week') +
    '</div>';

  // Week strip, so the gate states are visible.
  html += '<div class="week">' + BeastCore.getWeekDates(today).map(function (d, i) {
    var r = BeastCore.dayResult(state.items, state.log, d);
    var cls = 'day ' + (d === today ? 'today ' : '') + (d > today ? '' : r.gate);
    return '<div class="' + cls + '">' + BeastCore.DAYS[i] + '<br>' + d.slice(8) + '</div>';
  }).join('') + '</div>';

  var todays = state.items.filter(function (it) { return BeastCore.isAvailable(it, today); });
  html += todays.map(function (it) {
    var e = BeastCore.entryFor(state.log, it.id, today);
    var done = !!(e && e.done);
    var late = done && !BeastCore.isOnTime(it, e, today);
    return '<div class="item' + (done ? ' done' : '') + '" onclick="toggle(\'' +
      BeastCore.escHTMLAttr(it.id) + '\')">' +
      '<div class="box">' + (done ? '&#10003;' : '') + '</div>' +
      '<div><div>' + BeastCore.escapeHtml(it.name) +
        (it.core ? '<span class="tag core">core</span>' : '') +
        (late ? '<span class="tag late">late</span>' : '') + '</div>' +
      '<div class="meta">' + it.kind +
        (it.dueBy ? ' &middot; by ' + BeastCore.formatDueBy(it.dueBy) : '') + '</div></div></div>';
  }).join('');

  html += '<p><button onclick="reset()">Reset</button></p>';
  app.innerHTML = html;
}

function stat(v, label) {
  return '<div class="stat"><b>' + BeastCore.escapeHtml(v) + '</b><span>' + label + '</span></div>';
}

function reset() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  state = null;
  render();
}

var imported = importFromHash();
if (imported && !imported.ok) {
  document.getElementById('app').innerHTML =
    '<h1>Spike: Client</h1><p class="err">' + BeastCore.escapeHtml(imported.error) + '</p>';
} else {
  if (!state) load();
  render();
}
</script>
</body>
</html>
