<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Beast Mode Trainer</title>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
  --accent: #3b82f6; --accent2: #8b5cf6;
  --green: #22c55e; --orange: #f59e0b; --red: #ef4444;
  --text: #f1f5f9; --text2: #94a3b8; --border: #475569;
  --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
h1, h2, h3 { margin: 0; font-weight: 700; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; }
input, select, textarea {
  font: inherit; background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; min-height: 54px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 60px; }

header { background: var(--surface); border-bottom: 1px solid var(--surface2); }
header .wrap { display: flex; align-items: center; gap: 12px; padding-top: 13px; padding-bottom: 13px; }
header h1 { font-size: 18px; flex: 1; }
header h1 span { color: var(--accent); }

.btn { background: var(--accent); color: #fff; padding: 9px 15px; font-weight: 600; }
.btn.grey { background: var(--surface2); color: var(--text); }
.btn.green { background: var(--green); color: #052e16; }
.btn.danger { background: var(--red); color: #fff; }
.btn.sm { padding: 5px 9px; font-size: 12px; font-weight: 500; }
.btn.full { width: 100%; padding: 12px; margin-top: 12px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
.stat { background: var(--surface); border-radius: var(--radius); padding: 14px; text-align: center; }
.stat b { display: block; font-size: 26px; color: var(--accent); line-height: 1.1; }
.stat span { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; }

.sechead { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
.sechead h2 { font-size: 15px; flex: 1; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ccard { background: var(--surface); border-radius: var(--radius); padding: 15px; cursor: pointer; border: 1px solid transparent; }
.ccard:hover { border-color: var(--accent); }
.ccard .top { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.ccard .av { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-size: 19px; }
.ccard .nm { font-weight: 700; }
.ccard .sub, .muted { font-size: 12px; color: var(--text2); }

.empty { text-align: center; color: var(--text2); padding: 44px 16px; }
.empty .big { font-size: 42px; margin-bottom: 8px; }
.empty h2 { color: var(--text); margin-bottom: 6px; }

/* ── panel ─────────────────────────────────────────────────────────────── */
.panel { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.panel header { position: sticky; top: 0; z-index: 5; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--surface2); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; color: var(--text2); padding: 10px 13px; border-radius: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

.grouphead {
  display: flex; align-items: center; gap: 8px; margin: 18px 0 8px;
  font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em;
}
.grouphead .line { flex: 1; height: 1px; background: var(--surface2); }

.row { background: var(--surface); border-radius: var(--radius); padding: 12px; margin-bottom: 9px; border-left: 3px solid transparent; }
.row.core { border-left-color: var(--orange); }
.rtop { display: flex; gap: 8px; align-items: center; }
.rtop input.nm { flex: 1; font-weight: 600; }
.rtools { display: flex; gap: 4px; }
.rtools button { background: var(--surface2); color: var(--text2); padding: 5px 8px; font-size: 12px; line-height: 1; }
.rfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 9px; }
.rfields label { font-size: 11px; color: var(--text2); }
.rfields label input, .rfields label select { margin-top: 3px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); white-space: nowrap; }
.chk input { width: auto; }
.days { display: flex; gap: 4px; margin-top: 3px; }
.days button { flex: 1; background: var(--surface2); color: var(--text2); font-size: 11px; padding: 6px 2px; }
.days button.on { background: var(--accent); color: #fff; }

.preview-note { background: #3b82f622; border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
.pitem { background: var(--surface); border-radius: 10px; padding: 11px 13px; margin-bottom: 7px; border-left: 3px solid transparent; display: flex; gap: 10px; }
.pitem.core { border-left-color: var(--orange); }
.pbox { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 6px; flex: 0 0 auto; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 6px; margin-left: 6px; background: var(--surface2); color: var(--text2); text-transform: uppercase; }
.tag.core { background: #7c2d12; color: #fed7aa; }

.modal { position: fixed; inset: 0; z-index: 70; background: #000b; display: flex; align-items: center; justify-content: center; padding: 18px; overflow-y: auto; }
.modal > div { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 520px; width: 100%; }
.modal h2 { font-size: 19px; margin-bottom: 4px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.code { background: var(--bg); border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; max-height: 110px; overflow-y: auto; }
.warn { color: var(--orange); font-size: 13px; }
.err { color: var(--red); font-size: 13px; }
.ok { color: var(--green); font-size: 13px; }

.toast {
  position: fixed; right: 18px; bottom: 18px; background: var(--green); color: #052e16;
  font-weight: 700; font-size: 13px; padding: 9px 15px; border-radius: 999px;
  z-index: 99999; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }

@media (max-width: 600px) {
  .stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat b { font-size: 20px; }
  header h1 { font-size: 16px; }
}
</style>
</head>
<body>

<div id="root"></div>
<div id="panel"></div>
<div id="modal"></div>
<div id="toast" class="toast"></div>

<script src="lz-string.min.js"></script>
<script src="beast-core.js"></script>
<script>
'use strict';

/* Beast Mode trainer dashboard.

   All contract logic lives in BeastCore. Metric names, timings, frequencies,
   log keys and payload prefixes are never written inline here. See CLAUDE.md. */

var BUILT_AGAINST = '2.0.0';
var KEY = 'bm2.trainer';
var AVATARS = ['\u{1F4AA}', '\u{1F525}', '\u{1F98D}', '\u{1F3CB}', '\u{1F3AF}', '⚡', '\u{1F43A}', '\u{1F680}'];

var db = { clients: [] };
var openId = null;       // client detail panel
var panelTab = 'plan';
var saveTimer = null;

/* ── storage ───────────────────────────────────────────────────────────── */

function load() {
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null') || { clients: [] }; }
  catch (e) { db = { clients: [] }; }
  db.clients = (db.clients || []).map(function (c) {
    c.items = BeastCore.normalizeItems(c.items);
    c.goals = BeastCore.normalizeGoals(c.goals);
    c.profile = c.profile || {};
    return c;
  });
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Could not save. Storage may be full.', true); }
}

function autosave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { save(); toast('Saved'); }, 600);
}

function client(id) {
  for (var i = 0; i < db.clients.length; i++) if (db.clients[i].id === id) return db.clients[i];
  return null;
}

/* ── clients ───────────────────────────────────────────────────────────── */

function addClient(name) {
  name = (name || '').trim();
  if (!name) { toast('Give the client a name first', true); return; }
  var c = {
    id: BeastCore.newId(),
    name: name,
    profile: { name: name, avatar: AVATARS[0] },
    items: [],
    goals: [],
    createdAt: BeastCore.todayLocal(),
    lastSent: null
  };
  db.clients.push(c);
  save();
  closeModal();
  openClient(c.id);
}

function removeClient(id) {
  var c = client(id);
  if (!c) return;
  if (!confirm('Remove ' + c.name + ' and their plan from this dashboard? Their phone keeps what it already has.')) return;
  db.clients = db.clients.filter(function (x) { return x.id !== id; });
  save();
  closePanel();
}

/* ── items ─────────────────────────────────────────────────────────────── */

function addItem(cid, kind) {
  var c = client(cid);
  c.items.push(BeastCore.normalizeItem({ name: '', kind: kind, group: lastGroup(c) }, { addedAt: BeastCore.todayLocal() }));
  save();
  renderPanel();
}

function lastGroup(c) { return c.items.length ? c.items[c.items.length - 1].group : ''; }

function updateItem(cid, id, field, value) {
  var c = client(cid);
  var it = c.items.filter(function (x) { return x.id === id; })[0];
  if (!it) return;

  if (field.indexOf('detail.') === 0) {
    var k = field.slice(7);
    if (k.indexOf('target.') === 0) {
      it.detail.target = it.detail.target || {};
      var tk = k.slice(7);
      if (value === '') delete it.detail.target[tk];
      else it.detail.target[tk] = isNaN(Number(value)) ? value : Number(value);
    } else {
      it.detail[k] = value;
    }
  } else if (field === 'core') {
    it.core = value;
  } else {
    it[field] = value;
  }

  // Re-normalize so the same rules the client applies also apply here: a
  // weekly item with no days collapses to flexible, flexible is forced
  // non-core, an invalid dueBy is dropped.
  var keptAddedAt = it.addedAt;
  var fresh = BeastCore.normalizeItem(it, { addedAt: keptAddedAt });
  c.items = c.items.map(function (x) { return x.id === id ? fresh : x; });
  autosave();
  renderPanel();
}

function toggleDay(cid, id, day) {
  var c = client(cid);
  var it = c.items.filter(function (x) { return x.id === id; })[0];
  if (!it) return;
  var days = it.freq === 'weekly' ? it.days.slice() : [];
  var i = days.indexOf(day);
  if (i === -1) days.push(day); else days.splice(i, 1);
  it.freq = 'weekly';
  it.days = days;
  updateItem(cid, id, 'days', days);
}

function removeItem(cid, id) {
  var c = client(cid);
  c.items = c.items.filter(function (x) { return x.id !== id; });
  save();
  renderPanel();
}

function duplicateItem(cid, id) {
  var c = client(cid);
  var i = c.items.findIndex(function (x) { return x.id === id; });
  if (i === -1) return;
  var copy = BeastCore.normalizeItem(
    Object.assign({}, c.items[i], { id: BeastCore.newId(), name: c.items[i].name + ' copy' }),
    { addedAt: BeastCore.todayLocal() }
  );
  c.items.splice(i + 1, 0, copy);
  save();
  renderPanel();
}

function moveItem(cid, id, delta) {
  var c = client(cid);
  var i = c.items.findIndex(function (x) { return x.id === id; });
  var j = i + delta;
  if (i === -1 || j < 0 || j >= c.items.length) return;
  var tmp = c.items[i]; c.items[i] = c.items[j]; c.items[j] = tmp;
  save();
  renderPanel();
}

/* Apply one item's schedule across its whole group, so setting up a push day
   stays a single action even though scheduling lives per item. */
function applyScheduleToGroup(cid, id) {
  var c = client(cid);
  var src = c.items.filter(function (x) { return x.id === id; })[0];
  if (!src) return;
  var n = 0;
  c.items = c.items.map(function (it) {
    if (it.id === id || it.group !== src.group) return it;
    n++;
    return BeastCore.normalizeItem(
      Object.assign({}, it, { freq: src.freq, days: src.days.slice(), timesPerWeek: src.timesPerWeek, dueBy: src.dueBy }),
      { addedAt: it.addedAt }
    );
  });
  save();
  renderPanel();
  toast(n + ' item' + (n === 1 ? '' : 's') + ' updated');
}

/* ── goals ─────────────────────────────────────────────────────────────── */

function setGoals(cid, term, text) {
  var c = client(cid);
  var lines = text.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  var existing = c.goals.filter(function (g) { return g.term === term; });
  var other = c.goals.filter(function (g) { return g.term !== term; });
  // Match by text so an unchanged goal keeps its id and any client link to it.
  var rebuilt = lines.map(function (t) {
    var prev = existing.filter(function (g) { return g.text === t; })[0];
    return prev || { id: BeastCore.newId(), text: t, term: term, completed: false };
  });
  c.goals = other.concat(rebuilt);
  autosave();
}

/* ── sharing ───────────────────────────────────────────────────────────── */

function buildCode(c) {
  var kind = c.lastSent ? 'plan' : 'setup';
  return {
    kind: kind,
    code: BeastCore.encodePayload(kind, {
      items: c.items,
      goals: c.goals,
      profile: c.profile
    })
  };
}

function clientBaseUrl() {
  return location.href.replace(/trainer-dashboard\.html.*$/, 'index.html').split('#')[0];
}

async function shortenLink(url, slug) {
  // is.gd honours a custom slug; TinyURL is the fallback when it refuses one
  // or when no slug is given.
  if (slug) {
    try {
      var r = await fetch('https://is.gd/create.php?format=simple&shorturl=' +
        encodeURIComponent(slug) + '&url=' + encodeURIComponent(url));
      var t = (await r.text()).trim();
      if (r.ok && /^https?:\/\//.test(t)) return t;
    } catch (e) { /* fall through */ }
  }
  try {
    var r2 = await fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url));
    var t2 = (await r2.text()).trim();
    if (r2.ok && /^https?:\/\//.test(t2)) return t2;
  } catch (e) { /* fall through */ }
  return null;
}

function openShare(cid) {
  var c = client(cid);
  if (!c.items.length) { toast('Add at least one item first', true); return; }

  var built = buildCode(c);
  var base = clientBaseUrl();
  var full = base + '#import=' + built.code;
  var len = BeastCore.shareUrlLength(base, built.code);

  var size = len > BeastCore.SHARE_LIMITS.maxUrl
    ? '<p class="err">' + len + ' characters. Too long for a shortener. Trim notes or split the plan.</p>'
    : len > BeastCore.SHARE_LIMITS.warnUrl
      ? '<p class="warn">' + len + ' characters. Close to the shortener limit.</p>'
      : '<p class="ok">' + len + ' characters. Fits a shortener.</p>';

  showModal(
    '<h2>' + esc(built.kind === 'setup' ? 'First-time setup link' : 'Plan update link') + '</h2>' +
    '<p class="muted">' + esc(c.name) + ' · ' + c.items.length + ' items · perfect week ' +
      BeastCore.perfectWeek(c.items) + '</p>' + size +
    '<div class="field" style="margin-top:14px"><label>Short link name (optional)</label>' +
      '<input id="slug" placeholder="BM_' + attr(c.name.replace(/[^A-Za-z0-9]/g, '')) + '"></div>' +
    '<button class="btn full" onclick="doShorten(\'' + attr(cid) + '\')">Create short link</button>' +
    '<div id="shareout" style="margin-top:14px"></div>' +
    '<details style="margin-top:14px"><summary class="muted">More options</summary>' +
      '<button class="btn grey full" onclick="copyText(' + jsq(full) + ')">Copy long link</button>' +
      '<div class="code" style="margin-top:10px">' + esc(built.code) + '</div></details>' +
    '<button class="btn grey full" onclick="closeModal()">Close</button>'
  );
  window._shareState = { cid: cid, full: full, kind: built.kind };
}

async function doShorten(cid) {
  var s = window._shareState;
  var out = document.getElementById('shareout');
  var slug = (document.getElementById('slug') || {}).value || '';
  out.innerHTML = '<p class="muted">Shortening...</p>';

  var short = await shortenLink(s.full, slug.trim());
  if (!short) {
    out.innerHTML = '<p class="err">Both shorteners refused. Use the long link under More options.</p>';
    return;
  }
  s.short = short;
  var c = client(cid);
  var msg = s.kind === 'setup'
    ? 'Here is your Beast Mode plan. Open this on your phone: ' + short
    : 'Plan update. Open this on your phone: ' + short;

  out.innerHTML =
    '<div class="code">' + esc(short) + '</div>' +
    '<button class="btn full" onclick="copyText(' + jsq(short) + ')">Copy link</button>' +
    '<button class="btn grey full" onclick="shareNative(' + jsq(msg) + ')">Share</button>' +
    '<button class="btn grey full" onclick="location.href=' + jsq('sms:?&body=' + encodeURIComponent(msg)) + '">Text it</button>' +
    '<button class="btn green full" onclick="markSent(\'' + attr(cid) + '\')">Mark as sent</button>';
}

function markSent(cid) {
  var c = client(cid);
  c.lastSent = new Date().toISOString();
  save();
  closeModal();
  renderPanel();
  toast('Marked as sent');
}

function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { toast('Copied'); });
  else {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed', true); }
    ta.remove();
  }
}

function shareNative(msg) {
  if (navigator.share) navigator.share({ text: msg }).catch(function () {});
  else copyText(msg);
}

/* ── ui helpers ────────────────────────────────────────────────────────── */

function esc(s) { return BeastCore.escapeHtml(s); }
function attr(s) { return BeastCore.escHTMLAttr(s); }
function jsq(s) { return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n') + "'"; }

function toast(msg, bad) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = bad ? 'var(--red)' : 'var(--green)';
  t.style.color = bad ? '#fff' : '#052e16';
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 1900);
}

function showModal(html) { document.getElementById('modal').innerHTML = '<div class="modal"><div>' + html + '</div></div>'; }
function closeModal() { document.getElementById('modal').innerHTML = ''; }

/* ── roster ────────────────────────────────────────────────────────────── */

function render() {
  var root = document.getElementById('root');
  if (BeastCore.VERSION !== BUILT_AGAINST) {
    root.innerHTML = '<div class="wrap"><div class="empty"><div class="big">\u{1F504}</div>' +
      '<h2>Beast Mode was updated</h2><p>Reload this page to get the new version.</p></div></div>';
    return;
  }

  var withPlan = db.clients.filter(function (c) { return c.items.length; }).length;
  var sent = db.clients.filter(function (c) { return c.lastSent; }).length;

  root.innerHTML =
    '<header><div class="wrap"><h1>\u{1F4AA} Beast Mode <span>Trainer</span></h1>' +
    '<button class="btn" onclick="openAddClient()">+ Add client</button></div></header>' +
    '<div class="wrap">' +
      '<div class="stats">' +
        '<div class="stat"><b>' + db.clients.length + '</b><span>Clients</span></div>' +
        '<div class="stat"><b>' + withPlan + '</b><span>With a plan</span></div>' +
        '<div class="stat"><b>' + sent + '</b><span>Sent</span></div>' +
      '</div>' +
      (db.clients.length ? '<div class="grid">' + db.clients.map(clientCard).join('') + '</div>'
        : '<div class="empty"><div class="big">\u{1F4AA}</div><h2>No clients yet</h2>' +
          '<p>Add a client, build their checklist, send them the link.</p></div>') +
    '</div>';
}

function clientCard(c) {
  var core = c.items.filter(function (i) { return i.core; }).length;
  return '<div class="ccard" onclick="openClient(\'' + attr(c.id) + '\')">' +
    '<div class="top"><div class="av">' + esc(c.profile.avatar || AVATARS[0]) + '</div>' +
    '<div><div class="nm">' + esc(c.name) + '</div>' +
    '<div class="sub">' + (c.lastSent ? 'Sent ' + esc(c.lastSent.slice(0, 10)) : 'Not sent yet') + '</div></div></div>' +
    '<div class="sub">' + c.items.length + ' items, ' + core + ' core</div>' +
    '<div class="sub">Perfect week ' + BeastCore.perfectWeek(c.items) + '</div></div>';
}

function openAddClient() {
  showModal('<h2>Add client</h2>' +
    '<div class="field" style="margin-top:12px"><label>Name</label>' +
    '<input id="newname" placeholder="First name" autofocus></div>' +
    '<button class="btn full" onclick="addClient(document.getElementById(\'newname\').value)">Create</button>' +
    '<button class="btn grey full" onclick="closeModal()">Cancel</button>');
}

/* ── client panel ──────────────────────────────────────────────────────── */

function openClient(id) { openId = id; panelTab = 'plan'; renderPanel(); }
function closePanel() { openId = null; document.getElementById('panel').innerHTML = ''; render(); }
function setPanelTab(t) { panelTab = t; renderPanel(); }

function renderPanel() {
  if (!openId) return;
  var c = client(openId);
  if (!c) { closePanel(); return; }

  var tabs = [['plan', 'Plan'], ['goals', 'Goals'], ['profile', 'Profile'], ['preview', 'Preview']];
  document.getElementById('panel').innerHTML =
    '<div class="panel"><header><div class="wrap">' +
      '<button class="btn grey sm" onclick="closePanel()">‹ Back</button>' +
      '<h1>' + esc(c.name) + '</h1>' +
      '<button class="btn" onclick="openShare(\'' + attr(c.id) + '\')">Send</button>' +
    '</div></header><div class="wrap">' +
      '<div class="tabs">' + tabs.map(function (t) {
        return '<button class="' + (panelTab === t[0] ? 'active' : '') + '" onclick="setPanelTab(\'' + t[0] + '\')">' + t[1] + '</button>';
      }).join('') + '</div>' +
      (panelTab === 'plan' ? planTab(c) : panelTab === 'goals' ? goalsTab(c) :
       panelTab === 'profile' ? profileTab(c) : previewTab(c)) +
    '</div></div>';
}

function planTab(c) {
  var html = '<p class="muted">' + c.items.length + ' items · ' +
    c.items.filter(function (i) { return i.core; }).length + ' core · perfect week ' +
    BeastCore.perfectWeek(c.items) + ' points</p>';

  if (!c.items.length) {
    html += '<div class="empty"><div class="big">\u{1F4DD}</div><h2>Empty plan</h2>' +
      '<p>Add the checklist items this client works through.</p></div>';
  } else {
    var lastGroupName = null;
    html += c.items.map(function (it) {
      var head = '';
      if (it.group !== lastGroupName) {
        lastGroupName = it.group;
        head = '<div class="grouphead">' + esc(it.group || 'Ungrouped') + '<span class="line"></span></div>';
      }
      return head + itemRow(c, it);
    }).join('');
  }

  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">' +
    BeastCore.KINDS.map(function (k) {
      return '<button class="btn grey" onclick="addItem(\'' + attr(c.id) + '\',\'' + k + '\')">+ ' + esc(k) + '</button>';
    }).join('') + '</div>' +
    '<button class="btn danger full" style="margin-top:26px" onclick="removeClient(\'' + attr(c.id) + '\')">Remove client</button>';
  return html;
}

function itemRow(c, it) {
  var up = "updateItem('" + attr(c.id) + "','" + attr(it.id) + "',";
  var f = function (field) { return up + "'" + field + "',this.value)"; };

  var kindFields = '';
  if (it.kind === 'exercise') {
    kindFields =
      '<label>Metric<select onchange="' + f('detail.metric') + '">' +
        BeastCore.METRICS.map(function (m) {
          return '<option value="' + m + '"' + (it.detail.metric === m ? ' selected' : '') + '>' +
            esc(BeastCore.metricLabel(m)) + '</option>';
        }).join('') + '</select></label>' +
      BeastCore.targetFields(it.detail.metric).map(function (t) {
        var v = (it.detail.target && it.detail.target[t.key] != null) ? it.detail.target[t.key] : '';
        return '<label>' + esc(t.label) + '<input type="number" value="' + attr(v) +
          '" onchange="' + up + "'detail.target." + t.key + "',this.value)" + '"></label>';
      }).join('');
  } else if (it.kind === 'supplement') {
    kindFields =
      '<label>Dosage<input value="' + attr(it.detail.dosage || '') + '" onchange="' + f('detail.dosage') + '"></label>' +
      '<label>Timing<select onchange="' + f('detail.timing') + '">' +
        BeastCore.TIMINGS.map(function (t) {
          return '<option value="' + t + '"' + (it.detail.timing === t ? ' selected' : '') + '>' +
            esc(t.replace(/_/g, ' ')) + '</option>';
        }).join('') + '</select></label>';
  }

  var dayPills = it.freq === 'weekly'
    ? '<label style="grid-column:1/-1">Days<div class="days">' + BeastCore.DAYS.map(function (d, i) {
        return '<button class="' + (it.days.indexOf(i) !== -1 ? 'on' : '') + '" onclick="toggleDay(\'' +
          attr(c.id) + '\',\'' + attr(it.id) + '\',' + i + ')">' + d + '</button>';
      }).join('') + '</div></label>'
    : '';

  var flexField = it.freq === 'flexible'
    ? '<label>Times per week<input type="number" min="1" max="7" value="' + attr(it.timesPerWeek) +
      '" onchange="' + f('timesPerWeek') + '"></label>' : '';

  return '<div class="row' + (it.core ? ' core' : '') + '">' +
    '<div class="rtop">' +
      '<input class="nm" value="' + attr(it.name) + '" placeholder="Item name" onchange="' + f('name') + '">' +
      '<div class="rtools">' +
        '<button title="Move up" onclick="moveItem(\'' + attr(c.id) + '\',\'' + attr(it.id) + '\',-1)">↑</button>' +
        '<button title="Move down" onclick="moveItem(\'' + attr(c.id) + '\',\'' + attr(it.id) + '\',1)">↓</button>' +
        '<button title="Duplicate" onclick="duplicateItem(\'' + attr(c.id) + '\',\'' + attr(it.id) + '\')">⧉</button>' +
        '<button title="Remove" onclick="removeItem(\'' + attr(c.id) + '\',\'' + attr(it.id) + '\')">✕</button>' +
      '</div>' +
    '</div>' +
    '<div class="rfields">' +
      '<label>Group<input value="' + attr(it.group) + '" placeholder="Morning" onchange="' + f('group') + '"></label>' +
      '<label>Frequency<select onchange="' + f('freq') + '">' +
        BeastCore.FREQS.map(function (fr) {
          return '<option value="' + fr + '"' + (it.freq === fr ? ' selected' : '') + '>' + fr + '</option>';
        }).join('') + '</select></label>' +
      flexField +
      '<label>Due by<input value="' + attr(it.dueBy) + '" placeholder="08:00" onchange="' + f('dueBy') + '"></label>' +
      kindFields +
      dayPills +
      '<label class="chk" style="align-self:end"><input type="checkbox"' + (it.core ? ' checked' : '') +
        (it.freq === 'flexible' || it.freq === 'monthly' ? ' disabled' : '') +
        ' onchange="' + up + "'core',this.checked)" + '"> Core (gates the streak)</label>' +
      (it.group ? '<button class="btn grey sm" style="align-self:end" onclick="applyScheduleToGroup(\'' +
        attr(c.id) + '\',\'' + attr(it.id) + '\')">Apply schedule to group</button>' : '') +
      '<label style="grid-column:1/-1">Note for the client<input value="' + attr(it.notes) +
        '" onchange="' + f('notes') + '"></label>' +
    '</div></div>';
}

function goalsTab(c) {
  var text = function (term) {
    return c.goals.filter(function (g) { return g.term === term; })
      .map(function (g) { return g.text; }).join('\n');
  };
  var oc = function (term) {
    return 'setGoals(\'' + attr(c.id) + '\',\'' + term + '\',this.value)';
  };
  return '<p class="muted">One goal per line. The client agrees to these before their clock starts.</p>' +
    '<div class="field" style="margin-top:14px"><label>Next 4 weeks</label>' +
      '<textarea rows="4" oninput="' + oc('short') + '">' + esc(text('short')) + '</textarea></div>' +
    '<div class="field"><label>6 to 12 months</label>' +
      '<textarea rows="4" oninput="' + oc('long') + '">' + esc(text('long')) + '</textarea></div>';
}

function profileTab(c) {
  var p = c.profile;
  var f = function (k) { return "updateProfile('" + attr(c.id) + "','" + k + "',this.value)"; };
  var fields = [['sport', 'Sport or activity'], ['height', 'Height'], ['weight', 'Current weight'],
                ['goalWeight', 'Goal weight'], ['birthday', 'Birthday (YYYY-MM-DD)'], ['why', 'Why now']];
  return '<div class="field"><label>Name</label><input value="' + attr(c.name) + '" disabled></div>' +
    fields.map(function (x) {
      return '<div class="field"><label>' + x[1] + '</label><input value="' +
        attr(p[x[0]] || '') + '" onchange="' + f(x[0]) + '"></div>';
    }).join('') +
    '<div class="field"><label>Avatar</label><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      AVATARS.map(function (a) {
        return '<button class="btn ' + (p.avatar === a ? '' : 'grey') + '" style="font-size:20px;padding:8px 12px" ' +
          'onclick="updateProfile(\'' + attr(c.id) + '\',\'avatar\',\'' + a + '\')">' + a + '</button>';
      }).join('') + '</div></div>';
}

function updateProfile(cid, key, value) {
  var c = client(cid);
  c.profile[key] = value;
  if (key === 'avatar') { save(); renderPanel(); } else autosave();
}

function previewTab(c) {
  var today = BeastCore.todayLocal();
  var due = c.items.filter(function (it) { return BeastCore.isAvailable(it, today); });

  var html = '<div class="preview-note">What the client sees today (' + today + '). ' +
    'Their own checkoffs live on their phone.</div>';

  if (!due.length) {
    html += '<div class="empty"><p>Nothing scheduled for today in this plan.</p></div>';
  } else {
    var lastGroupName = null;
    html += due.map(function (it) {
      var head = '';
      if (it.group !== lastGroupName) {
        lastGroupName = it.group;
        head = '<div class="grouphead">' + esc(it.group || 'Ungrouped') + '<span class="line"></span></div>';
      }
      var meta = [esc(it.kind)];
      if (it.dueBy) meta.push('by ' + esc(BeastCore.formatDueBy(it.dueBy)));
      if (it.detail.dosage) meta.push(esc(it.detail.dosage));
      var t = BeastCore.formatTarget(it.detail);
      if (t) meta.push(esc(t));
      return head + '<div class="pitem' + (it.core ? ' core' : '') + '"><div class="pbox"></div><div>' +
        '<div style="font-weight:600">' + esc(it.name) +
          (it.core ? '<span class="tag core">core</span>' : '') + '</div>' +
        '<div class="muted">' + meta.join(' · ') + '</div>' +
        (it.notes ? '<div class="muted" style="font-style:italic">' + esc(it.notes) + '</div>' : '') +
        '</div></div>';
    }).join('');
  }

  var core = BeastCore.scheduledCoreOn(c.items, today).length;
  html += '<div class="preview-note" style="margin-top:16px">A perfect day here is worth ' +
    (due.length * (BeastCore.POINTS.base + BeastCore.POINTS.onTime) + core * BeastCore.POINTS.perfectDay) +
    ' points. ' + core + ' core item' + (core === 1 ? '' : 's') + ' gate the streak.</div>';
  return html;
}

/* ── boot ──────────────────────────────────────────────────────────────── */

load();
render();
</script>
</body>
</html>
