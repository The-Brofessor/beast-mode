function intakeCard() {
  var a = state.intakeAnswers || {};
  var any = Object.keys(a).some(function (k) { return String(a[k] || '').trim() !== ''; });
  if (!any) fetchAnswers();
  if (!any && !state.clientToken) return '';
  var open = !!state.intakeOpen;
  return '<div class="card"><h3>Your answers</h3>' +
    (any
      ? '<p class="imeta" style="margin-bottom:10px">What you told your coach when you started. The plan is built on this, so keep it true.</p>' +
        '<button class="btn sec" onclick="state.intakeOpen=!state.intakeOpen;save();render()">' + (open ? 'Hide my answers' : 'See my answers') + '</button>' +
        (open ? '<div style="margin-top:10px">' + answersHtml(a, BeastCore.visibleSections(a), false) + '</div>' : '')
      : '<p class="imeta" style="margin-bottom:10px">Your intake isn\u2019t on this phone.</p>') +
    (state.clientToken ? '<button class="btn" onclick="startIntakeUpdate()">' + (any ? 'Update my answers' : 'Fill it in') + '</button>' : '') +
    '</div>';
}

// The iPhone app (native app brief): Apple push, on first. Reminders for
// due-by times move onto the phone itself next (local notifications); until
// then this card turns notifications on and sends a test. Draft wording.
function nativeNotifyCard() {
  var on = !!(state.reminders && state.reminders.native);
  return '<div class="card"><h3>Notifications</h3>' +
    (on
      ? '<p class="imeta" style="margin-bottom:10px">On for this phone.</p>' +
        '<button class="btn sec" onclick="testNativePush()">Send a test notification</button>'
      : '<p class="imeta" style="margin-bottom:10px">Get a shout from The Brofessor when it matters.</p>' +
        '<button class="btn" onclick="enableNativePush()">Turn on notifications</button>') +
    '</div>';
}

async function enableNativePush() {
  var token;
  try { token = await BeastNative.enablePush(); }
  catch (e) {
    toast(e && e.message === 'denied' ? 'Notifications are off. Turn them on in the iPhone Settings app, under Beast Mode.'
      : 'Couldn’t turn notifications on. Try again in a minute.');
    return;
  }
  state.reminders = state.reminders || {};
  state.reminders.id = state.reminders.id || BeastCore.newId();
  try {
    var res = await fetch(PUSH_URL + '/device', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: state.reminders.id, token: token,
        tz: (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || 'UTC' }) });
    if (!res.ok) throw new Error('refused');
  } catch (e) { toast('Can’t reach the server right now. Try again in a minute.'); return; }
  state.reminders.native = true;
  save(); render();
  toast('Notifications on');
}

async function testNativePush() {
  var id = state.reminders && state.reminders.id;
  if (!id) return;
  try {
    var res = await fetch(PUSH_URL + '/device/test', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: id }) });
    var got = await res.json().catch(function () { return {}; });
    toast(res.ok ? 'Sent. It should arrive in a few seconds.' : (got.error || 'That didn’t go through.'));
  } catch (e) { toast('Can’t reach the server right now. Try again in a minute.'); }
}

function remindersCard() {
  if (isNativeApp()) return PUSH_URL ? nativeNotifyCard() : '';
  var slots = BeastCore.reminderSlots(state.items);
  if (!pushConfigured()) {
    return '<div class="card"><h3>Reminders</h3>' +
      '<p class="imeta">Not set up yet.</p></div>';
  }
  if (!slots.length) {
    return '<div class="card"><h3>Reminders</h3>' +
      '<p class="imeta">Nothing on your plan has a due-by time, so there is nothing to remind you about.</p></div>';
  }
  var q = (state.reminders && state.reminders.quiet) || { from: '22:00', to: '07:00' };
  return '<div class="card"><h3>Reminders</h3>' +
    '<p class="imeta">' + slots.map(function (s) { return BeastCore.formatDueBy(s); }).join(', ') +
      '. Only what is still outstanding gets a reminder.</p>' +
    (isIOS() && !isStandalone()
      ? '<p class="imeta">On iPhone, add Beast Mode to your home screen first.</p>' : '') +
    (remindersOn()
      ? '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">' +
          '<div class="field"><label>Quiet from</label><input type="time" value="' + attr(q.from) +
          '" onchange="setQuiet(\'from\',this.value)"></div>' +
        '<div class="field"><label>Until</label><input type="time" value="' + attr(q.to) +
          '" onchange="setQuiet(\'to\',this.value)"></div></div>' +
        '<button class="btn sec" style="margin-top:0" onclick="disableReminders()">Turn reminders off</button>'
      : '<button class="btn" onclick="enableReminders()">Turn reminders on</button>') +
    '</div>';
}

// Reminders are what bring someone back each day, so they are offered on Today
// once rather than left at the bottom of Profile for people to find.
function reminderNudge() {
  // The iPhone app turns notifications on from Profile (nativeNotifyCard).
  if (isNativeApp()) return '';
  if (!pushConfigured() || remindersOn()) return '';
  if (state.reminders && state.reminders.nudgeDismissed) return '';
  var slots = BeastCore.reminderSlots(state.items);
  if (!slots.length) return '';
  var times = slots.map(function (s) { return BeastCore.formatDueBy(s); });
  var list = times.length > 1 ? times.slice(0, -1).join(', ') + ' and ' + times[times.length - 1] : times[0];
  var ios = isIOS() && !isStandalone();
  // "Nudge" is a field name in the code and never on the screen (Chris).
  return '<div class="prompt">' + icon('bell') + '<div class="txt"><b>Want a reminder?</b>' +
    'Reminders come at ' + esc(list) + ', only if something’s still open.' +
    (ios ? ' On iPhone, add Beast Mode to your home screen first.' : '') +
    '<div class="acts">' + (ios ? '' : '<button class="pbtn" onclick="enableReminders()">Turn on</button>') +
    '<button class="gbtn" onclick="dismissNudge()">' + (ios ? 'Got it' : 'Not now') + '</button></div></div></div>';
}

/* ── install ───────────────────────────────────────────────────────────── */

var deferredPrompt = null;
var DISMISS_KEY = 'bm2.installDismissed';

// The iPhone app counts as the home-screen app: it is the app they keep, so
// no install screen is ever shown inside it.
function isNativeApp() { return !!(window.BeastNative && BeastNative.isNative); }
function isStandalone() {
  return isNativeApp() || window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// Safari itself, the only iPhone browser that can add an app to the home
// screen. Chrome, Firefox and the browsers inside other apps cannot, so they
// are never shown instructions they cannot follow (BeastCore.iosSafari).
function isIOSSafari() {
  return BeastCore.iosSafari(navigator.userAgent, 'standalone' in window.navigator) && !window.MSStream;
}

// The way out of the install screen, for a client who cannot or will not add
// it to the home screen. Their plan still works here; it is Safari that will
// forget it eventually, which is what the screen was trying to prevent.
// On an intake link there may be no plan here yet, so the choice is kept
// with the form, which the phone and the server already hold.
function skipInstall(kind) {
  if (kind === 'intake') { intake.skipInstall = true; saveIntake(); }
  else { state.skipInstall = true; save(); }
  render();
}

function installDismissed() {
  try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
}

function dismissInstall() {
  try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
  render();
}

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  render();
});

window.addEventListener('appinstalled', function () {
  deferredPrompt = null;
  render();
});

function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function () { deferredPrompt = null; render(); });
}

function installCard() {
  if (isStandalone() || installDismissed()) return '';

  // iOS has no install prompt event. Adding to the home screen is a manual
  // Share then Add to Home Screen, and on iOS it is also the only way to get
  // reminders later, so the instructions are worth showing.
  var close = '<button class="x" aria-label="Dismiss" onclick="dismissInstall()">' + icon('x') + '</button>';
  if (isIOS()) {
    return '<div class="install">' + icon('phone') +
      '<div class="txt"><b>Put this on your home screen</b>' +
      'Tap Share at the bottom of Safari, then Add to Home Screen. Then open Beast Mode from your home screen and paste your link there once.</div>' + close + '</div>';
  }
  if (!deferredPrompt) return '';
  return '<div class="install">' + icon('phone') +
    '<div class="txt"><b>Install Beast Mode</b>Opens straight to your list, works without signal.</div>' +
    '<button class="pbtn" onclick="doInstall()">Install</button>' + close + '</div>';
}

/* ── rendering ─────────────────────────────────────────────────────────── */

function esc(s) { return BeastCore.escapeHtml(s); }
function attr(s) { return BeastCore.escHTMLAttr(s); }

function render() {
  var root = document.getElementById('root');

  if (BeastCore.VERSION !== BUILT_AGAINST) {
    root.innerHTML = '<div class="wrap"><div class="empty" style="padding-top:80px">' +
      '<div class="big">' + icon('refresh') + '</div><h2>Beast Mode was updated</h2>' +
      '<p>Close this page and open it again to get the new version.</p></div></div>';
    return;
  }
  // A questionnaire in progress outranks everything: the client has not been
  // sent a plan yet, so there is nothing else for them to look at. A form
  // opened from an intake link shows even beside a plan (a returning client).
  // On iPhone Safari the install comes first, as it does for a plan: the
  // form is answered once, in the app they will keep (first-client path, 4a).
  if (intakeNeedsInstall()) { root.innerHTML = installFirstScreen('intake'); return; }
  if (intake &&(!state || intake.token || intake.sent || intake.routineOnly || intake.update)) { root.innerHTML = intakeScreen(); return; }
  if (!state) { root.innerHTML = setupScreen(); return; }
  // iPhone, Safari, a plan just arrived and nothing answered yet: the
  // welcome waits until Beast Mode is on the home screen, so it is answered
  // once, in the app they will keep (BeastCore.needsInstallFirst).
  if (BeastCore.needsInstallFirst({
    ios: isIOSSafari(), standalone: isStandalone(), hasPlan: !state.waiting,
    welcomeDone: !needsWelcome(), hasHistory: BeastCore.hasAppHistory(state),
    skipped: !!state.skipInstall
  })) { root.innerHTML = installFirstScreen(); askForBoss(); return; }
  if (needsWelcome()) {
    // Answered already, elsewhere? The server is asked once; the welcome
    // shows unless it says every answer stands (BeastCore.welcomeOnFile).
    if (welcomeCheck === null) checkWelcomeOnFile();
    root.innerHTML = welcomeCheck === 'pending'
      ? '<div class="wrap"><div class="empty" style="padding-top:80px"><p>One second...</p></div></div>'
      : welcomeScreen();
    return;
  }

  // Waiting for the plan (first-client path, 4c): Home, Coach and Profile.
  // Profile holds only what exists yet: the coach questions and Delete my
  // chats (choicesCard shows what a phone with no client token can change).
  if (state.waiting) {
    if (tab !== 'coach' && tab !== 'profile') tab = 'today';
    root.innerHTML = header() + '<div class="wrap">' +
      (tab === 'coach' ? coachTab() : tab === 'profile' ? '<div style="margin-top:18px">' + waitingBadges() + choicesCard() + '</div>' : waitingHome()) +
      '</div>' + navBar();
    measureNav(root);
    return;
  }
  // Running a goal by The Brofessor from its card: the chat, and a way back.
  if (lookChat) {
    tab = 'coach';
    // Before the plan starts there is no day count and no rank to show; the
    // bar where the tab bar would be keeps clear of the home indicator
    // (CTO, step 4).
    var top = state.goalsAgreedAt ? header()
      : '<header><div class="wrap"><div class="hrow">' + mark('sm', '') + '<div class="hwho"><div class="hname">' +
        esc(state.profile.name || 'Beast Mode') + '</div></div></div></div></header>';
    root.innerHTML = top + '<div class="wrap"><button class="btn sec lookback" onclick="backToGoals()">' +
      (lookChat.day ? 'Back to your new day' : 'Back to your goals') + '</button>' + coachTab() + '</div>';
    document.documentElement.style.setProperty('--nav-h', 'env(safe-area-inset-bottom, 0px)');
    resolveSongLinks(root);
    var ask = document.getElementById('coach-input');
    if (ask && lookChat.fresh) {
      ask.value = lookChat.day ? 'About my new day: ' : 'About my goal “' + lookChat.text + '”: ';
      lookChat.fresh = false;
    }
    return;
  }
  // The first look, and the recommit at a new block (goals brief 4c, 4f).
  // A recommit whose goals are all gone has nothing to ask (CTO, step 4).
  if (state.recommit && !lookGoals().length) { state.recommit = null; state.look = null; save(); }
  if (!state.goalsAgreedAt || state.recommit) { root.innerHTML = firstLookScreen(); return; }
  // A new plan block arrived: the routine, asked again (loop brief 5d).
  if (routineDue()) { if (!intake) startRoutineAgain(); root.innerHTML = intakeScreen(); return; }
  // How your plan works, opened from Profile.
  if (howView !== null) { root.innerHTML = howScreen(); return; }

  root.innerHTML = header() + '<div class="wrap">' +
    (tab === 'today' ? todayTab() : tab === 'week' ? weekTab() :
     tab === 'coach' ? coachTab() : profileTab()) +
    '</div>' + navBar();
  measureNav(root);
}

function measureNav(root) {
  // The coach input sits on top of the tab bar, whose height depends on the
  // font and the phone's bottom inset, so it is measured rather than assumed.
  var nav = root.querySelector('nav');
  if (nav) document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
  // Every screen with the bar has been drawn: point the Play buttons at
  // their songs (Apple Music).
  if (tab === 'coach') resolveSongLinks(root);
}

/* The plan link, kept so the install screen can hand it back on the
   clipboard: after adding the app to the home screen, a client would
   otherwise have to go and find the message again. Their own plan, on their
   own phone, beside the plan itself. */
var LINK_KEY = 'bm2.lastlink';
var copyFailed = false;

// The install screen's only way forward, so a browser with no clipboard gets
// the link on screen to select by hand rather than a dead end.
function copyPlan(link) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(function () { toast('Copied'); },
      function () { copyFailed = true; render(); });
  } else { copyFailed = true; render(); }
}

function rememberLink(code) {
  try { localStorage.setItem(LINK_KEY, APP_URL + '/#import=' + encodeURIComponent(code)); } catch (e) {}
}

function lastLink() {
  try { return localStorage.getItem(LINK_KEY) || ''; } catch (e) { return ''; }
}

// Home while the plan is built (first-client path, 4c): where the plan
// link is pasted when it comes, and the way to the coach. Chris's
// wording, approved 2026-09-23.
function waitingHome() {
  return '<div class="card" style="margin-top:18px"><h3>Your plan is on its way</h3>' +
      '<p class="imeta">Your coach is building it from your answers. When the link comes, paste it here.</p>' +
      '<div style="margin-top:12px"><textarea id="pastelink" rows="3" placeholder="' + attr(pastePlaceholder()) + '"></textarea></div>' +
      '<button class="btn" style="margin-top:10px" onclick="openPasted()">Open my plan</button></div>' +
    '<div class="card"><h3>Questions while you wait?</h3>' +
      '<button class="btn sec" style="margin-top:6px" onclick="go(\'coach\')">Talk to The Brofessor</button></div>';
}

function setupScreen() {
  // A tapped link opens in Safari, and on iPhone the home-screen app does
  // not share Safari's storage, so the link has to be pasted in here once.
  return '<div class="wrap"><div class="empty" style="padding-top:72px">' +
    '<div class="big">' + mark('', '') + '</div><h2>Beast Mode</h2>' +
    '<p>No plan on this phone yet.<br>Paste the link your coach sent you to get started.</p>' +
    '<div style="margin-top:18px;text-align:left"><textarea id="pastelink" rows="3" placeholder="' + attr(pastePlaceholder()) + '"></textarea></div>' +
    '<button class="pbtn full" style="margin-top:10px" onclick="openPasted()">Open my plan</button>' +
    '<p class="imeta" style="margin-top:22px;color:var(--text3)">Lost the link? Text your coach for a new one.</p>' +
    '</div></div>';
}

// The pasted text: a long link carries the plan itself; a short link is
// asked for from the server, which answers with the same code the link
// would have opened. Either way the import is the one a tapped link runs.
// The lines below are in Chris's voice, like the rest of this screen: he
// sends the links. Awaiting Chris's approval. The app owns every line,
// so the server's wording is never shown here.
var pasteBusy = false;
function openPasted() {
  var box = document.getElementById('pastelink');
  openLinkText(box && box.value);
}

// A pasted message, or a link tapped outside the iPhone app that opened it
// (BeastNative.onLink): the same path either way.
async function openLinkText(text) {
  if (pasteBusy) return;
  var found = BeastCore.linkFromText(text);
  // Six letters: the invite code the web page showed a client who tapped
  // the link before installing the app (native app brief). The server
  // trades it for the link, which then opens as if tapped.
  // The server sets the length (8, Chris 2026-09-25); 6 to 8 letters are tried.
  var inviteCode = found ? '' : String(text || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (!found && inviteCode.length >= 6 && inviteCode.length <= 8) {
    pasteBusy = true;
    var link = '';
    try {
      var r = await fetch(COACH_URL + '/invite/redeem', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ code: inviteCode }) });
      var got = await r.json().catch(function () { return {}; });
      if (!got.link) { toast(got.error || 'That code didn’t work. Text your coach for a new link.'); return; }
      link = got.link;
    } catch (e) { toast('Can’t reach the server right now. Try again in a minute.'); return; }
    finally { pasteBusy = false; }
    found = BeastCore.linkFromText(link);
  }
  if (!found) { toast('That doesn’t look like a Beast Mode link'); return; }
  if (found.intake) { openIntakeLink(found.intake); return; }
  var code = found.code;
  if (!code) {
    pasteBusy = true;
    try {
      var res = await fetch(LINK_URL + '/p/' + encodeURIComponent(found.slug), { headers: { accept: 'application/json' } });
      var data = res.ok ? await res.json() : null;
      if (!data || !data.code) { toast(res.status === 404 ? 'That link has expired. Text your coach for a new one.' : 'Can’t reach the server right now. Try again in a minute.'); return; }
      code = data.code;
    } catch (e) { toast('Can’t reach the server right now. Try again in a minute.'); return; }
    finally { pasteBusy = false; }
  }
  // A bad paste keeps the box, rather than the dead-end screen a tapped
  // link gets: a home-screen app has no reload button.
  var decoded = BeastCore.decodePayload(code);
  if (!decoded.ok) { toast('That link didn’t work. Paste the whole message your coach sent'); return; }
  importCode(decoded, code);
}

/* Wording awaiting Chris's approval, 2026-09-22. Spoken by Chris, like the
   rest of the screens a client meets before the coach. */
// One step: what to press, drawn, then what it is called.
function step(n, ic, label, hint) {
  // A name from ICONS, or markup for something an icon cannot say: the Add
  // button is a filled pill with a word in it, so it is drawn as one.
  var drawn = ic.charAt(0) === '<';
  return '<div class="step"><div class="n">' + n + '</div>' +
    '<div class="ico' + (drawn ? ' raw' : '') + '">' + (drawn ? ic : icon(ic)) + '</div>' +
    '<div class="txt"><b>' + label + '</b>' + (hint ? '<span>' + hint + '</span>' : '') + '</div></div>';
}

// An icon inside a sentence, sized to the text rather than to a card.
function inlineIcon(name) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round" class="inline-icon">' + ICONS[name] + '</svg>';
}

// The install screen's words for each link it can hand back. The plan's are
// Chris's, approved 2026-09-22; the intake's approved 2026-09-23 (first-
// client path, decision 6).
var INSTALL_WORDS = {
  plan: { heading: 'Put Beast Mode home, then upload your plan', button: 'Copy My Plan',
          already: 'Already have Beast Mode on your home screen? Tap Copy My Plan, open it, and paste.' },
  // A client with a plan updates their answers from Profile, not from a
  // link (Chris, 2026-09-23); Keep going in Safari covers one sent anyway.
  intake: { heading: 'Put Beast Mode home, then start your intake', button: 'Copy My Link',
            already: 'Already have Beast Mode on your home screen? Tap Copy My Link, open it, and paste.' }
};

// An intake link opened in Safari on an iPhone, by someone who has not yet
// started the form or had a plan in this browser, and has not chosen to stay.
function intakeNeedsInstall() {
  if (!intake || !intake.token || intake.sent) return false;
  return BeastCore.needsInstallFirst({
    ios: isIOSSafari(), standalone: isStandalone(), intakeLink: true,
    welcomeDone: false, hasHistory: BeastCore.hasAppHistory(state) || answeredAnything(),
    skipped: !!intake.skipInstall
  });
}

function installFirstScreen(kind) {
  if (APP_STORE_URL) return appStoreScreen(kind);
  var forIntake = kind === 'intake';
  var words = INSTALL_WORDS[forIntake ? 'intake' : 'plan'];
  // The intake link is rebuilt from its token rather than read from the
  // address bar, so it is always the bare link, whatever Safari added to it.
  var link = forIntake ? APP_URL + '/#intake=' + encodeURIComponent(intake.token) : lastLink();
  var number = forIntake ? intakeBossNumber() : bossNumber();
  return '<div class="wrap"><div class="empty" style="padding-top:28px;padding-bottom:24px">' +
    '<div class="big">' + mark() + '</div><h2 class="fit">' + esc(words.heading) + '</h2>' +
    '<p>On iPhone, Beast Mode has to live on your home screen, not in Safari. It is the only place ' +
      'that allows it to have full functionality and work offline. ' +
      // With a link to copy, the line above the Copy button says what to do
      // (Chris, 2026-09-23: too many words on a phone). Without one there is
      // no button, so this is the only instruction.
      (link ? '' : 'After following the steps below, open Beast Mode from your home screen and paste in the link your coach sent you.') +
    '</p>' +
    '<div class="steps">' +
      step(1, 'dots', 'Tap the three dots', 'bottom right of this screen') +
      step(2, 'share', 'Tap Share', 'top of the menu that opens') +
      step(3, 'more', 'Tap View More', 'only if you do not see the next one') +
      step(4, 'addhome', 'Tap Add to Home Screen', 'near the bottom of the list') +
      step(5, '<span class="addpill">Add</span>', 'Tap Add', 'top right. Leave Open as Web App on') +
    '</div>' +
    '<p class="imeta" style="margin-top:-2px;margin-bottom:12px;color:var(--text3)">' +
      'On an older iPhone there are no dots: the Share button is already in the bar at the bottom.<br><br>' +
      (link ? esc(words.already)
            : 'Already have Beast Mode on your home screen? Open it and paste in the link your coach sent you.') + '</p>' +
    (link ? '<button class="pbtn" style="margin-top:4px" onclick="copyPlan(' + attr(jsq(link)) + ')">' + esc(words.button) + '</button>' +
      '<p class="imeta" style="margin-top:10px;color:var(--text3)">Puts your link on the clipboard, ready to paste.</p>' +
      (copyFailed ? '<p class="imeta" style="color:var(--text3)">This browser won’t copy it. Hold on the link below, Select All, then Copy.</p>' +
        '<div class="code" style="text-align:left;word-break:break-all">' + esc(link) + '</div>' : '') : '') +
    '<p class="imeta" style="margin-top:16px;color:var(--text3)">Need help? ' +
      '<a href="' + attr('sms:' + number) + '">Text your coach</a>' +
      '<br><br><a href="#" onclick="skipInstall(' + (forIntake ? '\'intake\'' : '') + ');return false">Keep going in Safari for now</a></p>' +
    '</div></div>';
}

/* Once the iPhone app is in the App Store, iPhone Safari sends people there
   instead of to the home-screen steps, with a code standing for the link
   they tapped: typed once in the app, it opens that link (native app brief,
   2026-09-25). Draft wording. */
var invite = { link: '', code: '', failed: false };
function appStoreScreen(kind) {
  var forIntake = kind === 'intake';
  var link = forIntake ? APP_URL + '/#intake=' + encodeURIComponent(intake.token) : lastLink();
  if (link && invite.link !== link) {
    invite = { link: link, code: '', days: 0, failed: false };
    askInvite(link, forIntake ? { intakeToken: intake.token }
      : state && state.coachToken ? { token: state.coachToken } : { clientToken: state && state.clientToken });
  }
  var number = forIntake ? intakeBossNumber() : bossNumber();
  var code = invite.code
    ? '<div class="invitecode">' + esc(invite.code.replace(/^(.{4})(.+)$/, '$1 $2')) + '</div><p class="imeta" style="color:var(--text3)">The code works once, for ' + invite.days + ' days.</p>'
    : invite.failed || !link ? '<p class="imeta">Open the app and paste the text your coach sent you.</p>'
    : '<p class="imeta">Getting your code...</p>';
  return '<div class="wrap"><div class="empty" style="padding-top:40px;padding-bottom:24px">' +
    '<div class="big">' + mark() + '</div><h2 class="fit">Get the Beast Mode app</h2>' +
    '<p>Beast Mode lives in the app. Get it from the App Store, open it, and type this code:</p>' + code +
    '<a class="pbtn" style="display:block;text-decoration:none;margin-top:14px" href="' + attr(APP_STORE_URL) + '">Get the app</a>' +
    '<p class="imeta" style="margin-top:16px;color:var(--text3)">Need help? ' +
      '<a href="' + attr('sms:' + number) + '">Text your coach</a>' +
      '<br><br><a href="#" onclick="skipInstall(' + (forIntake ? '\'intake\'' : '') + ');return false">Keep going in Safari for now</a></p>' +
    '</div></div>';
}
// The server makes a code only for a phone holding one of the client's
// tokens (CTO, 2026-09-25).
async function askInvite(link, who) {
  try {
    var r = await fetch(COACH_URL + '/invite', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.assign({ link: link }, who)) });
    var got = await r.json().catch(function () { return {}; });
    if (invite.link !== link) return;
    if (got.code) { invite.code = got.code; invite.days = got.expiresInDays || 14; } else invite.failed = true;
  } catch (e) { if (invite.link === link) invite.failed = true; }
  render();
}

/* Chris's number, which only the server knows, so it is never in this public
   repo. An empty one still opens Messages, with the client picking him from
   their contacts: that is how they were sent the link in the first place. */
function bossNumber() {
  return /^\+?[0-9]{7,15}$/.test(state && state.coachBoss || '') ? state.coachBoss : '';
}

/* The install screen is the first thing a new iPhone client sees, before the
   coach has ever been asked anything, so the number is fetched here too.
   Quiet on failure: the link still opens Messages. */
var bossAsked = false;
async function askForBoss() {
  if (bossAsked || !state || state.coachBoss || !state.coachToken) return;
  bossAsked = true;
  var data = await coachPost('/coach/status', {});
  if (data && 'boss' in data && data.boss) { state.coachBoss = data.boss; save(); render(); }
}

/* ── the first look (goals brief 4c, 4f, 4i) ────────────────────────────
   At first plan open, after the welcome: How Beast Mode works, then Your
   day, rebuilt with One change at a time, then one card per goal, each
   agreed with GOT IT. The last GOT IT starts the plan. At a new block
   (every card) or when the coach changed a goal mid-block (only those
   cards), the cards come back: the recommit, which never moves the plan's
   start (4l.8 of the CTO review). Every line here is Chris's wording from
   the reviewed screens, except where marked as a placeholder. */

var lookChat = null;      // { text, fresh }: a goal being run by The Brofessor mid-look
var lookDay = 'work';     // Your day, rebuilt: 'work' or 'off'

// Chris's overview of the app. Kept for the first-link welcome (queued
// 2026-09-25); the plan's arrival uses HOW_SLIDES below.
var HOW_LINES = [
  ['Your plan is your new day.', 'Your workouts and meals are done for you. We also help you create new habits based on what you told us so you actually follow them.'],
  ['Every goal is broken into steps.', 'Monthly, Weekly, Daily. The steps adjust as you progress.'],
  ['Tick your checklist every day.', 'Wake up, workout, hit your macros, screens off, bedtime. Whatever is on the list that day check it off. Bonus points for getting it done on time!'],
  ['The Brofessor is your guru.', 'He can answer any question about your plan, explain an exercise, suggest a different meal, or even make a playlist for you.']
];
// What to expect once the plan arrives, for someone who has no idea what
// the app does (Chris, 2026-09-25): four slides before the goal cards, again
// at every new block with Skip, and from Profile any time. Draft wording.
// Slide 1 has three versions: a first plan, a new block, and Profile.
var HOW_SLIDES = [
  { title: { first: 'Your plan is here.', block: 'Your next block is here.', profile: 'How your plan works.' },
    lines: { first: ['Your coach built it from your answers: your schedule, your training, your goals.',
                     'Next: read your goals, then your new day. If something won’t work, tell The Brofessor before you start. When it looks right, tap GOT IT and your plan starts.'],
             block: ['Your coach built it from your last 4 weeks and your answers.',
                     'Next: read your goals, then your new day. If something won’t work, tell The Brofessor. When it looks right, tap GOT IT and the new block starts.'],
             profile: ['Your coach built it from your answers: your schedule, your training, your goals.',
                       'If something isn’t working, tell The Brofessor. Only your coach changes the plan.'] } },
  { title: 'Every day: open it, tick it off.',
    lines: ['Your checklist is your day: wake up, workout, meals, supplements, screens off, bed.',
            'Tick each one when you do it. Ticking it on time earns bonus points. Reminders come when something is due.'] },
  { title: 'One change at a time.',
    lines: ['You won’t change your whole life on day one. Your plan adds one new habit at a time, at the pace you pick: slower, standard or faster.',
            'Keep last week’s habits going as each new one starts. Every 4 weeks your coach builds your next block.'] },
  { title: 'How you’ll know it’s working.',
    lines: ['Each goal has a target for the month, the week and the day. Once a week is Measure day: weight, and waist, body fat and how your clothes fit if you have them. Hit your steps to earn points and move up the ranks.',
            'Miss one and your coach helps you adjust. The Brofessor answers questions any time. Only your coach changes the plan.'] }
];
var howView = null;       // the slide open from Profile, or null
var PACE_WORDS = { slower: 'Slower', standard: 'Standard', faster: 'Faster' };
var PACE_NOTES = { slower: 'One change every two weeks.', standard: 'One change a week.', faster: 'Two changes a week.' };

function lookState() { if (!state.look) state.look = { step: 0, card: 0 }; return state.look; }

// A plan link can be forwarded or made by hand, so the budget in it is
// checked here, whatever the dashboard checked (CTO, step 4): two known
// kinds of day, whole minutes, text as text.
function cleanBudget(list) {
  if (!Array.isArray(list)) return [];
  var mins = function (v) { var n = Math.floor(Number(v)); return isFinite(n) && n >= 0 && n < 1440 ? n : 0; };
  return list.filter(function (b) { return b && typeof b === 'object' && (b.day === 'work' || b.day === 'off'); })
    .slice(0, 2).map(function (b) {
      return { day: b.day, need: mins(b.need), found: mins(b.found), from: String(b.from == null ? '' : b.from).slice(0, 300) };
    });
}
// '13:00' -> '1:00 pm': minutes always, and a space before am or pm, as the
// screens were approved.
function lookTime(hhmm) {
  var m = BeastCore.minutesOfDay(hhmm);
  if (m === null) return '';
  var h = Math.floor(m / 60), mm = m % 60;
  return (h % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + (h < 12 ? ' am' : ' pm');
}
function lookDate(ymd) { return BeastCore.localToDate(ymd).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }

function lookGoals() {
  var ids = state.recommit ? state.recommit.ids : null;
  return (state.goals || []).filter(function (g) { return !ids || ids.indexOf(g.id) !== -1; });
}

function lookHasDay() {
  return !!((state.budget && state.budget.length) ||
    state.items.some(function (it) { return it.swap || (it.steps && it.steps.length); }));
}

// Goals first, then the day built to reach them, and the day is the last
// thing agreed (Chris, 2026-09-25): the why, then the how.
function lookSteps() {
  var s = [];
  if (!state.recommit || state.recommit.newBlock) s.push('how');
  s.push('goals');
  if (lookHasDay() && (!state.recommit || state.recommit.newBlock)) s.push('day');
  return s;
}

// The plan's start as the look sees it: today for a first plan, the real
// start once the plan is running.
function lookStart() { return state.goalsAgreedAt ? (state.profile.startDate || BeastCore.todayLocal()) : BeastCore.todayLocal(); }
function lookBlockStart() { return BeastCore.blockStartOf(lookStart(), state.block || 1); }

function firstLookScreen() {
  var L = lookState(), steps = lookSteps();
  var step = steps[Math.min(L.step, steps.length - 1)];
  if (step === 'how') return howScreen();
  if (step === 'day') return dayScreen();
  return goalCardScreen();
}

function lookNext() {
  var L = lookState();
  L.step++; L.card = 0;
  save(); window.scrollTo(0, 0); render();
}

// One slide of HOW_SLIDES. In the look, Skip goes straight to the goals; from
// Profile the last button closes.
function howScreen() {
  var inProfile = howView !== null;
  var mode = inProfile ? 'profile' : state.recommit ? 'block' : 'first';
  var i = inProfile ? howView : (lookState().slide || 0);
  i = Math.max(0, Math.min(HOW_SLIDES.length - 1, i));
  var s = HOW_SLIDES[i], last = i === HOW_SLIDES.length - 1;
  var title = typeof s.title === 'string' ? s.title : s.title[mode];
  var lines = Array.isArray(s.lines) ? s.lines : s.lines[mode];
  var go = inProfile ? (last ? 'howClose()' : 'howGo(1)') : (last ? 'lookNext()' : 'howGo(1)');
  var label = last ? (inProfile ? 'Done' : 'Show me my goals') : 'Next';
  return '<div class="modal center agree look"><div>' +
    '<div class="lead howlead"><span>How your plan works</span>' +
      '<button onclick="' + (inProfile ? 'howClose()' : 'lookNext()') + '">' + (inProfile ? 'Close' : 'Skip') + '</button></div>' +
    '<div class="hownum">' + (i + 1) + '</div><h2 class="howt">' + esc(title) + '</h2>' +
    lines.map(function (l) { return '<p class="howp">' + esc(l) + '</p>'; }).join('') +
    '<div class="dots">' + HOW_SLIDES.map(function (x, k) { return '<i' + (k === i ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' +
    '<button class="btn" style="margin-top:16px" onclick="' + go + '">' + label + '</button>' +
    (i > 0 ? '<button class="btn sec" style="margin-top:8px" onclick="howGo(-1)">Back</button>' : '') +
    '</div></div>';
}

function howGo(d) {
  if (howView !== null) { howView = Math.max(0, Math.min(HOW_SLIDES.length - 1, howView + d)); render(); return; }
  var L = lookState();
  L.slide = Math.max(0, Math.min(HOW_SLIDES.length - 1, (L.slide || 0) + d));
  save(); render();
}
function howOpen() { howView = 0; window.scrollTo(0, 0); render(); }
function howClose() { howView = null; tab = 'profile'; render(); }

// "30 min of TV. Half an hour more sleep." -> what it was, and what it gains.
function splitReplaces(s) {
  var t = String(s || '').trim();
  var i = t.indexOf('. ');
  return i === -1 ? { was: t.replace(/\.$/, ''), gain: '' } : { was: t.slice(0, i), gain: t.slice(i + 2) };
}

// The two kinds of day: the first work day the client tapped, and the first
// day they did not (the weekend when they gave none).
function lookDayIndex(kind) {
  var picks = BeastCore.picksOf((state.intakeAnswers || {}).workDays).map(function (d) { return BeastCore.DAYS.indexOf(d); })
    .filter(function (i) { return i >= 0; });
  if (kind === 'work') return picks.length ? picks[0] : 0;
  var off = [5, 6, 0, 1, 2, 3, 4].filter(function (i) { return picks.indexOf(i) === -1; })[0];
  return off === undefined ? 5 : off;
}

// When a swap starts at the client's pace: the weeks added to the block's
// start first, then never before today, in the same order as the core
// (BeastCore.scheduleSwaps), so the screen and the stored date agree. A
// change already under way shows the date it started (CTO, step 4).
function swapStartDate(n, stored) {
  var t = BeastCore.todayLocal();
  if (state.goalsAgreedAt && stored && stored <= t) return stored;
  var d = BeastCore.addDays(lookBlockStart(), 7 * (BeastCore.startWeekFor(n, state.pace) - 1));
  return d > t ? d : t;
}

// The week of the block under way, 1 to 4, for a card shown mid-block.
function lookWeekNow() {
  if (!state.goalsAgreedAt) return 1;
  var n = Math.floor(BeastCore.daysBetween(lookBlockStart(), BeastCore.todayLocal()) / 7) + 1;
  return Math.max(1, Math.min(4, n));
}

// Minutes from midnight in the look's words: 540 -> '9:00 am'.
function minsWords(m) {
  var h = Math.floor(m / 60) % 24, mm = m % 60;
  return (h % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + (h < 12 ? ' am' : ' pm');
}

// The whole day (Chris, 2026-09-25): what the client told us about their day,
// merged with the plan's items, in time order. The intake gives work hours,
// meals, the training slot and, when the plan has none, wake and bed; the
// plan gives every item with a time, its change and what it gains.
function dayRows(kind, idx) {
  var p = kind === 'work' ? 'work' : 'off';
  var a = state.intakeAnswers || {};
  var at = function (key, pm) { return BeastCore.timeFromText(a[key], pm ? { pm: true } : undefined); };
  var rows = [];
  var planItems = state.items.filter(function (it) {
    return it.dueBy && (it.freq === 'daily' || (it.freq === 'weekly' && it.days.indexOf(idx) !== -1));
  });
  var hasWake = planItems.some(function (it) { return /^wake[\s-]?up\b/i.test(it.name); });
  var hasBed = planItems.some(function (it) { return /^(lights out|bed)\b/i.test(it.name); });
  planItems.forEach(function (it) {
    var r = splitReplaces(it.replaces);
    var sd = it.swap ? swapStartDate(it.swap, it.addedAt) : '';
    var starts = sd && sd > BeastCore.todayLocal() ? 'Starts ' + lookDate(sd) : '';
    var wake = /^wake[\s-]?up\b/i.test(it.name);
    rows.push({ m: BeastCore.minutesOfDay(it.dueBy), order: wake ? 0 : 2, name: wake ? 'Wake up' : it.name,
      was: r.was ? 'Was: ' + r.was : '',
      gain: [r.gain, starts, wake && kind === 'off' ? 'Sleep in, up to an hour' : '']
        .filter(Boolean).map(function (x) { return x.replace(/\.$/, ''); }).join('. ') });
  });
  var wakeAt = at(p + 'Wake');
  if (!hasWake && wakeAt !== null) rows.push({ m: wakeAt, order: 0, name: 'Wake up' });
  if (kind === 'work') {
    var s = at('workStart'), e = at('workEnd');
    if (s !== null) rows.push({ m: s, order: 1, name: 'Work' + (e !== null ? ' until ' + minsWords(e) : '') });
  }
  var count = parseFloat(a[p + 'MealCount']);
  var fixed = BeastCore.picksOf(a.fixedTime);
  var meals = [];
  for (var i = 1; !isNaN(count) && i <= count && i <= 6; i++) {
    var mt = at(p + 'Meal' + i);
    if (mt === null) continue;
    var where = a[p + 'Meal' + i + 'Where'];
    meals.push({ m: mt, order: 1, name: 'Meal ' + i + (where ? (where === 'out' ? ', out' : ', at ' + where) : ''), home: where === 'home' });
  }
  // Family dinner never moves: the last meal at home from 5 pm, when they
  // said family dinner is fixed.
  if (fixed.indexOf('family dinner') !== -1) {
    var dinner = meals.filter(function (x) { return x.home && x.m >= 17 * 60; }).pop();
    if (dinner) { dinner.locked = true; dinner.name = 'Family dinner'; }
  }
  rows = rows.concat(meals);
  var tr = at(p + 'Train');
  if (tr !== null) {
    var tr2 = at(p + 'Train2');
    rows.push({ m: tr, order: 1, name: 'Training, your first choice', gain: tr2 !== null ? 'Fallback ' + minsWords(tr2) : '' });
  }
  var bed = at(p + 'Bed', true);
  if (!hasBed && bed !== null) rows.push({ m: bed, order: 1, name: 'Bed' });
  // A time after midnight belongs at the end of the day, not the start.
  rows.forEach(function (r) { if (r.m < 4 * 60 && /^(lights out|bed)\b/i.test(r.name)) r.m += 24 * 60; });
  return rows.sort(function (x, y) { return x.m - y.m || x.order - y.order; });
}

function dayScreen() {
  var kind = lookDay, idx = lookDayIndex(kind);
  var b = (state.budget || []).filter(function (x) { return x.day === kind; })[0];
  var rows = dayRows(kind, idx).map(function (r) {
    return '<li class="' + (r.locked ? 'fixed' : '') + '"><span class="t">' + esc(minsWords(r.m)) + '</span><span>' +
      '<div class="w">' + esc(r.name) + (r.locked ? '<span class="lock">doesn’t move</span>' : '') + '</div>' +
      (r.was ? '<div class="was">' + esc(r.was) + '</div>' : '') +
      (r.gain ? '<div class="gain">' + esc(r.gain) + '</div>' : '') +
      '</span></li>';
  }).join('');
  var ans = state.intakeAnswers || {};
  var fixed = BeastCore.picksOf(ans.fixedTime).filter(function (p) { return p !== 'none'; });
  if (ans.fixedMore && String(ans.fixedMore).trim()) fixed.push(String(ans.fixedMore).trim());
  var hasOff = (state.budget || []).some(function (x) { return x.day === 'off'; });
  var seg = hasOff ? '<div class="seg" style="margin-bottom:14px">' +
      '<button class="' + (kind === 'work' ? 'on' : '') + '" onclick="setLookDay(\'work\')">Training day</button>' +
      '<button class="' + (kind === 'off' ? 'on' : '') + '" onclick="setLookDay(\'off\')">Day off</button></div>' : '';
  var budget = b ? '<div class="budget"><div><b>' + esc(String(b.need)) + ' min</b><span>The plan needs</span></div>' +
      '<div class="ok"><b>' + esc(String(b.found)) + ' min</b><span>We found</span></div>' +
      '<div><b>' + esc(String(Math.max(0, b.found - b.need))) + ' min</b><span>To spare</span></div></div>' +
      (b.from ? '<div class="from">Found: ' + esc(b.from) + '</div>' : '') : '';
  // What the day is for: the goals they just agreed to (Chris, 2026-09-25).
  var aims = lookGoals().map(function (g) { return g.text; });
  var aim = aims.length ? '<p class="from" style="font-size:15px;color:var(--text);margin:-4px 0 12px">Built to get you to ' +
    esc(aims.length > 1 ? aims.slice(0, -1).join(', ') + ' and ' + aims[aims.length - 1] : aims[0]) + '.</p>' : '';
  return '<div class="wrap" style="padding-top:18px"><div class="card band">' +
    '<div class="lead">Your day, rebuilt.</div>' + aim + seg + budget +
    (rows ? '<ul class="tl">' + rows + '</ul>' : '') +
    (fixed.length ? '<div class="fixedline"><b>Doesn’t move</b>' + esc(fixed.join(', ')) + '</div>' : '') +
    '</div>' + changesCard() + '</div>';
}

function setLookDay(k) { lookDay = k; render(); }

// One change at a time: the swaps in the order they start at the client's
// pace. Above each, the weeks it builds on; a moving target shows its old
// time and no "+" (Chris's layout, 2026-09-25).
function swapUnits() {
  var u = [];
  state.items.forEach(function (it) {
    if (it.swap) u.push({ n: it.swap, at: it.addedAt, text: it.name + (it.dueBy ? ' by ' + lookTime(it.dueBy) : ''), was: splitReplaces(it.replaces).was, step: false });
    (it.steps || []).forEach(function (s, j) {
      var prev = j ? it.steps[j - 1].dueBy : it.dueBy;
      u.push({ n: s.swap, at: s.at, text: s.label || (it.name + ' by ' + lookTime(s.dueBy)), was: 'Was ' + lookTime(prev), step: true });
    });
  });
  return u.sort(function (a, b) { return a.n - b.n; });
}

function changesCard() {
  var units = swapUnits();
  var pace = BeastCore.paceOf(state.pace);
  var list = units.map(function (u) {
    var week = BeastCore.startWeekFor(u.n, pace);
    var upTo = Math.min(week, 5) - 1;
    var carry = upTo < 1 ? '' : upTo === 1 ? 'Week 1 goals' : upTo === 2 ? 'Week 1 + 2 goals' : 'Week 1 to ' + upTo + ' goals';
    return '<div class="wk"><b>' + (week > 4 ? 'Next block' : 'Week ' + week) +
      (week <= 4 ? '<small>' + esc(lookDate(swapStartDate(u.n, u.at))) + '</small>' : '') + '</b><span>' +
      (carry ? '<div class="keep">' + carry + '</div>' : '') +
      '<div class="w">' + (carry && !u.step ? '+ ' : '') + esc(u.text) + '</div>' +
      (u.was ? '<div class="was">' + esc(u.step ? u.was : 'Replaces ' + u.was.charAt(0).toLowerCase() + u.was.slice(1)) + '</div>' : '') +
      '</span></div>';
  }).join('');
  return '<div class="card" style="margin-top:14px">' +
    (units.length
      ? '<div class="sectitle">One change at a time</div>' +
        '<p style="color:var(--text2);margin-bottom:12px">Not everything at once, easiest first. Each change adds to the ones before it, so keep doing those too. Pick your pace. You can change it later.</p>' +
        '<div class="seg">' + BeastCore.PACES.map(function (p) {
          return '<button class="' + (p === pace ? 'on' : '') + '" onclick="setLookPace(\'' + p + '\')">' + PACE_WORDS[p] + '</button>';
        }).join('') + '</div>' +
        '<p class="imeta" style="margin:8px 0 6px">' + PACE_NOTES[pace] + '</p>' + list
      : '') +
    // The day is agreed too (Chris, 2026-09-25): talk it through first if
    // something will not work, then the last GOT IT starts the plan.
    (coachAvailable() ? '<button class="btn sec" style="margin-top:14px" onclick="lookAskDay()">Run it by The Brofessor</button>' : '') +
    '<button class="btn" style="margin-top:' + (coachAvailable() ? '8' : '14') + 'px" onclick="finishLook()">GOT IT. Let’s go.</button></div>';
}

function lookAskDay() {
  lookChat = { text: 'my new day', fresh: true, day: true };
  tab = 'coach';
  render();
}

// The client's pace. While the look is open, only the choice is kept and
// the screen shows its weeks; the dates move once, at the last GOT IT
// (finishLook), so trying the options never pins a change to today (CTO,
// step 4).
function setLookPace(p) {
  state.pace = BeastCore.paceOf(p);
  state.paceAt = new Date().toISOString();
  save(); render();
}

// Dates the changes at the client's pace. A change that started before
// today keeps its date for good; one dated today by the plan update that
// brought it has not been seen yet, so it moves with the pace (4l.1).
function reschedulePace() {
  var today = BeastCore.todayLocal();
  var prev = state.items.map(function (it) {
    return { id: it.id, addedAt: it.addedAt < today ? it.addedAt : '9999-12-31',
      steps: (it.steps || []).map(function (s) { return { swap: s.swap, at: s.at && s.at < today ? s.at : '' }; }) };
  });
  state.items = BeastCore.scheduleSwaps(state.items, { planStart: state.profile.startDate || today, pace: state.pace, today: today, prev: prev });
}

function unitOf(g) {
  var k = g.measure && g.measure.kind;
  return k === 'weight' ? ' lbs' : k === 'waist' ? ' inches' : k === 'bodyfat' ? '%' : '';
}
function stepWords(g, s) {
  if (!s) return '';
  if (s.text) return s.text;
  if (s.target === null || s.target === undefined || s.target === '') return '';
  if (g.measure.kind === 'habit') return s.target + ' days that week';
  return typeof s.target === 'number' ? s.target + unitOf(g) : String(s.target);
}

function goalCardScreen() {
  var goals = lookGoals(), L = lookState();
  if (!goals.length) {
    return '<div class="modal center agree look"><div><div class="lead">This is where it starts.</div>' +
      '<div class="amark">' + mark() + '</div><h2>Your goals</h2>' +
      '<p style="margin-top:6px;text-align:center">Your coach hasn’t set your goals yet. You can start anyway.</p>' +
      '<button class="btn" style="margin-top:20px" onclick="finishLook()">GOT IT</button></div></div>';
  }
  var i = Math.min(L.card, goals.length - 1), g = goals[i];
  var pw = BeastCore.perfectWeek(state.items);
  var pts = function (kind) { var v = BeastCore.stepValue(kind, pw); return v ? '<em class="pts">+' + v.toLocaleString() + ' pts</em>' : ''; };
  var changed = state.recommit && (state.recommit.changed || []).indexOf(g.id) !== -1;
  var body = '<h2>' + esc(g.text) + '</h2>' +
    (changed ? '<p style="text-align:center;margin:4px 0 0"><span class="changed">Your coach changed this</span></p>' : '') +
    (g.why ? '<div class="gk">Why this goal?</div><div class="why">“' + esc(g.why) + '”</div>' : '');
  if (g.measure) {
    var block = state.block || 1;
    var months = g.months || [];
    var month = months.filter(function (s) { return s.n === block; })[0] || months[0];
    var mi = months.indexOf(month);
    if (months.length) {
      body += '<div class="gk">The path · ' + months.length + (months.length === 1 ? ' step' : ' steps') + '</div><div class="gpath">' +
        months.map(function (s, k) {
          var t = s.target === null || s.target === undefined || s.target === '' ? (s.text || '') : String(s.target);
          return '<span' + (k === mi ? ' class="on"' : '') + '>' + esc(t) + '</span>';
        }).join('<i>›</i>') + '</div>';
    }
    if (month) {
      body += '<div class="gk">Goal this month</div><div class="gstep"><b>' + esc(stepWords(g, month)) + '</b><span>by ' +
        esc(lookDate(BeastCore.addDays(lookStart(), BeastCore.BLOCK_DAYS * month.n - 1))) + pts('m') + '</span></div>';
    }
    var week = null, weekWhen = '';
    // The step under way, not always the first (CTO, step 4; brief 4k.2):
    // a habit goal's latest change that has started, else its first; an
    // outcome goal's week of the block today falls in.
    if (g.measure.kind === 'habit') {
      var byStart = (g.weeks || []).slice().sort(function (a, b) { return a.swap - b.swap; }).map(function (s) {
        var it = state.items.filter(function (x) { return x.swap === s.swap || (x.steps || []).some(function (y) { return y.swap === s.swap; }); })[0];
        var stored = it ? (it.swap === s.swap ? it.addedAt : ((it.steps || []).filter(function (y) { return y.swap === s.swap; })[0] || {}).at) : '';
        return { s: s, from: swapStartDate(s.swap, stored) };
      });
      var today = BeastCore.todayLocal();
      var started = byStart.filter(function (x) { return x.from <= today; });
      var pick = started.length ? started[started.length - 1] : byStart[0];
      if (pick) { week = pick.s; weekWhen = pick.from <= today ? 'this week' : 'from ' + lookDate(pick.from); }
    } else {
      var now = lookWeekNow();
      week = (g.weeks || []).filter(function (s) { return s.n === now; })[0] || (g.weeks || [])[0];
      if (week) weekWhen = 'this week';
    }
    if (week) body += '<div class="gk">Goal this week</div><div class="gstep"><b>' + esc(stepWords(g, week)) + '</b><span>' + esc(weekWhen) + pts('w') + '</span></div>';
    var link = BeastCore.goalLink(g);
    var mine = state.items.filter(function (it) { return it.goalId && (it.goalId === link || it.goalId === g.id); });
    if (mine.length) {
      body += '<div class="gk">Every day <span class="gkn">(check these off)</span></div><div class="dayitems">' +
        mine.map(function (it) { return '<span>' + esc(it.name) + '</span>'; }).join('') + '</div>';
    }
  }
  var dots = goals.length > 1 ? '<div class="dots">' + goals.map(function (x, k) { return '<i' + (k === i ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' : '';
  return '<div class="modal center agree look"><div>' +
    '<div class="lead">Goal ' + (i + 1) + ' of ' + goals.length + '</div>' + body +
    (coachAvailable() ? '<button class="btn sec" style="margin-top:18px" onclick="lookAsk(' + i + ')">Run it by The Brofessor</button>' : '') +
    '<button class="btn"' + (coachAvailable() ? '' : ' style="margin-top:18px"') + ' onclick="lookGotIt()">GOT IT</button>' + dots +
    '</div></div>';
}

// GOT IT on a card: the next card, then the day when there is one, else
// the plan starts.
function lookGotIt() {
  var L = lookState();
  L.card++;
  if (L.card >= lookGoals().length) {
    var steps = lookSteps();
    if (steps.indexOf('goals') < steps.length - 1) { lookNext(); return; }
    finishLook(); return;
  }
  save(); window.scrollTo(0, 0); render();
}

function lookAsk(i) {
  var g = lookGoals()[i];
  if (!g) return;
  lookChat = { text: g.text, fresh: true };
  tab = 'coach';
  render();
}

function backToGoals() { lookChat = null; tab = 'today'; render(); }

// The last GOT IT. A first plan starts here; a recommit records the cards
// and a new ladder, and moves nothing else.
function finishLook() {
  var now = new Date().toISOString();
  var ids = lookGoals().map(function (g) { return g.id; });
  state.goals.forEach(function (g) { if (ids.indexOf(g.id) !== -1) g.agreedAt = now; });
  state.look = null;
  if (!state.goalsAgreedAt) {
    agreeToGoals();
    state.ladder = BeastCore.ladderSnapshot(BeastCore.ladderWeek(state.items, state.goals, state.perfectWeek), null, 1);
    save();
    return;
  }
  if (state.recommit && state.recommit.newBlock) reschedulePace();
  state.ladder = BeastCore.ladderSnapshot(BeastCore.ladderWeek(state.items, state.goals, state.perfectWeek), state.ladder, state.earnedLevel);
  state.recommit = null;
  save(); render();
  toast('Locked in');
}

function todayTab() {

    ? Math.round(((p.points - floor) / (next.points - floor)) * 100) : 100;
  var dp = dayPct(today);

    '<div class="summary">' +

        '<circle cx="42" cy="42" r="36" fill="none" stroke="var(--acc-line)" stroke-width="8" stroke-linecap="round" ' +
          'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - dp / 100)).toFixed(1) + '"' +
          (dp ? '' : ' opacity="0"') + '/></svg>' +
        '<div class="pct"><div><b class="num">' + dp + '%</b><span>Today</span></div></div></div>' +
      '<div class="figs">' +
        '<div class="fig"><b class="num">' + p.points.toLocaleString() + '</b><span>points</span></div>' +
        '<div class="fig"><b class="num">' + p.streak + '</b><span>day streak</span></div>' +
      '</div>' +
      '<button class="rankline" onclick="openRanks()"><div class="rankrow"><b>' + esc(p.level.rank) + '</b><span>' +
        (next ? (next.points - p.points).toLocaleString() + ' to ' + esc(next.rank) : 'Top rank') +
        '</span></div><div class="bar"><i style="width:' + Math.max(2, Math.min(100, pct)) + '%"></i></div></button>' +
    '</div>';

  var open = state.goals.filter(function (g) { return !g.completed; });
  if (open.length) {

      '<span class="g">' + esc(open[0].text) + '</span>' +
      (open.length > 1 ? '<span class="more">+' + (open.length - 1) + '</span>' : '') + '</button>';
  }

  html += reminderNudge();

    (sentAt ? 'Sent today. Send again?' : 'Send my day') + '</button>';

function dayPct(date) {
  var due = state.items.filter(function (it) { return BeastCore.isScheduled(it, date); });
  if (!due.length) return 100;
  var done = due.filter(function (it) { return BeastCore.isDone(state.log, it.id, date); }).length;
  return Math.round((done / due.length) * 100);
}

function itemList(date) {
  var due = state.items.filter(function (it) { return BeastCore.isAvailable(it, date); });
  if (!due.length) {
    return '<div class="empty"><div class="big">' + icon('moon') + '</div><p>Nothing on the list for this day.</p></div>';
  }
  // Groups follow plan order, so a push day reads top to bottom.
  var groups = [];
  due.forEach(function (it) {
    var g = groups.filter(function (x) { return x.name === it.group; })[0];
    if (!g) { g = { name: it.group, items: [] }; groups.push(g); }
    g.items.push(it);
  });

  var anyKey = due.some(function (it) { return it.core; });
  return groups.map(function (g) {
    var d = g.items.filter(function (it) { return BeastCore.isDone(state.log, it.id, date); }).length;
    return (g.name
      ? '<div class="group-label"><b>' + esc(g.name) + '</b><span>' + d + ' of ' + g.items.length + '</span></div>'
      : '<div style="height:16px"></div>') +
      '<div class="list">' + g.items.map(function (it) { return itemCard(it, date); }).join('') + '</div>';
  }).join('') +
  (anyKey ? '<button class="legend" onclick="openRanks()"><span class="key"></span>Key item: keeps your streak alive.' +
    '<u>How scoring works</u></button>' : '');
}

// What a client reads under an item. The wording lives in BeastCore; the
// fallback covers a phone briefly paired with a cached older core.
function itemMeta(it) {
  return BeastCore.itemSummary ? BeastCore.itemSummary(it) : BeastCore.detailLine(it);
}

function clockOf(iso) {
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  return (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? 'am' : 'pm');
}

function itemCard(it, date) {
  var e = BeastCore.entryFor(state.log, it.id, date);
  var done = !!(e && e.done);
  var fields = BeastCore.usesMetric(it.kind) ? BeastCore.targetFields(it.detail.metric) : [];
  var meta = itemMeta(it);

  // Right-hand side: the finish time once done (or "Late"), else the due time.
  var right = '';
  if (done) {
    right = BeastCore.isOnTime(it, e, date)
      ? '<span class="iright stamp">' + esc(clockOf(e.completedAt)) + '</span>'
      : '<span class="iright late">Late</span>';
  } else if (BeastCore.dueByOn(it, date)) {
    // The time in force that day: a moving target's step once it has started.
    var dueOn = BeastCore.dueByOn(it, date);
    var now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
    var dueM = BeastCore.minutesOfDay(dueOn);
    var soon = date === BeastCore.todayLocal() && dueM - mins <= 60;
    right = '<span class="iright num' + (soon ? ' soon' : '') + '">' + esc(BeastCore.formatDueBy(dueOn)) + '</span>';
  }

  var values = '';
  if (done && fields.length) {
    var logged = e.values && Object.keys(e.values).length;
    var planLine = BeastCore.formatTarget(it.detail, true);
    var args = '\'' + attr(it.id) + '\',\'' + attr(date) + '\'';
    if (!openValues[it.id]) {
      values = '<button class="logbtn" onclick="toggleValues(\'' + attr(it.id) + '\')">' +
        (e.asPlanned ? 'Did it as planned. Change' : logged ? 'Edit what you did' : 'Log what you did') +
        '</button>';
    } else {
      // Fields start empty: a number in a box must be something the client
      // did, never a guess. "Did it as planned" is the one-tap path and is
      // recorded as such, so planned and edited stay distinguishable.
      values = '<div class="values">' +
        (planLine
          ? '<div class="imeta" style="margin-bottom:10px">Plan: ' + esc(planLine) + '</div>' +
            '<button class="pbtn" style="width:100%;min-height:44px;margin-bottom:14px" ' +
              'onclick="saveAsPlanned(' + args + ')">Did it as planned</button>' +
            '<div class="imeta" style="margin-bottom:8px">Or enter what you did</div>'
          : '') +
        '<div class="fields">' + fields.map(function (f) {
          var v = (e.values && e.values[f.key] != null && !e.asPlanned) ? e.values[f.key] : '';
          return '<label>' + esc(f.label) + '<input type="number" inputmode="decimal" value="' + attr(v) + '" ' +
            'data-val="' + attr(it.id) + '" data-key="' + attr(f.key) + '"></label>';
        }).join('') + '</div>' +
        '<div class="field-err imeta" id="err-' + attr(it.id) + '" style="color:var(--bad);margin-top:6px"></div>' +
        '<div class="acts">' +
          '<button class="' + (planLine ? 'btn sec' : 'pbtn') + '" style="margin:0;flex:1;min-height:44px;padding:0 16px" ' +
            'onclick="saveValues(' + args + ')">Save</button>' +
          '<button class="gbtn" style="min-height:44px" onclick="toggleValues(\'' + attr(it.id) + '\')">Cancel</button>' +
        '</div></div>';
    }
  }

  var tap = 'toggleItem(\'' + attr(it.id) + '\',\'' + attr(date) + '\')';
  return '<div class="item' + (done ? ' done' : '') + '">' +
    '<button class="irow" onclick="' + tap + '" aria-label="' + (done ? 'Undo ' : 'Complete ') + attr(it.name) + '">' +
      '<span class="tick">' + icon('check') + '</span>' +
      '<span class="ibody"><span class="iname">' + esc(it.name) +
        (it.core ? '<span class="key" title="Keeps your streak alive"></span>' : '') + '</span>' +
        (meta ? '<div class="imeta2">' + esc(meta) + '</div>' : '') +
        (it.notes ? '<div class="inotes">' + esc(it.notes) + '</div>' : '') +
      '</span>' + right + '</button>' + values + '</div>';
}

function weekTab() {
  var today = BeastCore.todayLocal();
  var week = BeastCore.getWeekDates(today);
  var sel = (pickedDay && week.indexOf(pickedDay) !== -1) ? pickedDay : today;

  var picker = '<div class="daypick">' + week.map(function (d, i) {
    // Today is still open, so it gets no verdict dot until it is over.
    var cls = d > today ? 'future' : d === today ? '' : BeastCore.dayResult(state.items, state.log, d).gate;
    return '<button class="' + cls + (d === sel ? ' sel' : '') + '" onclick="pickDay(\'' + d + '\')">' +
      BeastCore.DAYS[i] + '<span class="dn">' + Number(d.slice(8)) + '</span></button>';
  }).join('') + '</div>';

  var rows = state.items.map(function (it) {
    var cells = week.map(function (d) {
      if (!BeastCore.isAvailable(it, d)) return '<td><div class="cell off"></div></td>';
      if (d > today) return '<td><div class="cell future"></div></td>';
      var done = BeastCore.isDone(state.log, it.id, d);
      return '<td><div class="cell' + (done ? ' done' : '') + '" onclick="toggleItem(\'' +
        attr(it.id) + '\',\'' + attr(d) + '\')">' + icon('check') + '</div></td>';
    }).join('');
    return '<tr><td class="nm">' + esc(it.name) +
      (it.core ? '<span class="key"></span>' : '') + '</td>' + cells + '</tr>';
  }).join('');

  var grid = '<table class="weekgrid"><thead><tr><th class="nm">Item</th>' +
    week.map(function (d, i) { return '<th>' + BeastCore.DAYS[i] + '<br>' + Number(d.slice(8)) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows + '</tbody></table>';

  return picker + grid + itemList(sel);
}

  // Apple guideline 5.1.1(v): an account can be deleted from inside the app.
  if (state.coachToken || state.clientToken) {
    html += '<div class="card"><h3>Delete my account</h3>' +
      '<p class="imeta">' + esc(DELETE_ACCOUNT.card) + '</p>' +
      '<button class="btn danger" onclick="openDeleteAccount()">Delete my account</button></div>';
  }

  return html;
}

// Draft wording (native app brief, 2026-09-25), for Chris.
var HEALTH_NOTE = 'Beast Mode and The Brofessor coach fitness, food and habits. They are not medical care. ' +
  'Talk to your doctor before a medical decision, like starting or changing a medication.';
var DELETE_ACCOUNT = {
  card: 'Erases your account: your chats, answers, progress and plan, on this phone and on the server.',
  title: 'Delete your account?',
  // The server waits 7 days before it erases (Chris, 2026-09-25), so a
  // forwarded link cannot erase anyone for good by mistake.
  text: 'This phone is signed out now. Your chats, your answers, your progress and your plan are erased for good in 7 days. ' +
    'Changed your mind before then? Text your coach. To use Beast Mode again you would need a new link.',
  button: 'Delete my account',
  done: 'Signed out. Your account is erased in 7 days.'
};

function openDeleteAccount() {
  showSheet(
    '<h2 style="font-size:20px;margin-bottom:4px">' + esc(DELETE_ACCOUNT.title) + '</h2>' +
    '<p class="imeta">' + esc(DELETE_ACCOUNT.text) + '</p>' +
    '<p id="delacct-err" class="imeta" style="color:var(--bad)"></p>' +
    '<button id="delacct-go" class="btn danger" onclick="deleteAccount()">' + esc(DELETE_ACCOUNT.button) + '</button>' +
    '<button class="btn sec" onclick="closeSheet()">Cancel</button>'
  );
}

// The server goes first. Only once it says the account is gone does the
// phone forget everything; a failure leaves both, and says so.
async function deleteAccount() {
  var btn = document.getElementById('delacct-go');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  var body = state.coachToken ? { token: state.coachToken } : { clientToken: state.clientToken };
  var data;
  try {
    var res = await fetch(COACH_URL + '/account/delete', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    });
    data = await res.json().catch(function () { return {}; });
    data.status = res.status;
  } catch (e) { data = { status: 0 }; }
  if (!data.ok) {
    btn.disabled = false;
    var err = document.getElementById('delacct-err');
    if (err) err.textContent = data.status === 0 ? 'Can’t reach the server right now. Try again in a minute.'
      : (data.error || 'That didn’t go through. Try again in a minute.');
    return;
  }
  // Reminders stop with the account: the push worker forgets the phone, the
  // browser drops its subscription, and the reminder copy kept for the
  // service worker (IndexedDB) goes too (CTO, 2026-09-25).
  try {
    if (PUSH_URL && state.reminders && state.reminders.id) {
      await fetch(PUSH_URL + '/unsubscribe', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: state.reminders.id }) }).catch(function () {});
    }
    if ('serviceWorker' in navigator && !isNativeApp()) {
      var reg = await navigator.serviceWorker.getRegistration();
      var sub = reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
      if (sub) await sub.unsubscribe();
    }
  } catch (e) {}
  try { if (window.indexedDB) indexedDB.deleteDatabase(IDB); } catch (e) {}
  // Everything this app kept on the phone, except the look (theme, colour).
  try {
    var mine = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^bm2\./.test(k) && k !== PREFS_KEY) mine.push(k);
    }
    mine.forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) {}
  state = null; intake = null;
  tab = 'today';
  closeSheet();
  render();
  toast(DELETE_ACCOUNT.done);
}

/* ── boot ──────────────────────────────────────────────────────────────── */

function handleImport() {
  var token = readIntakeHash();
  if (token) { openIntakeLink(token); return true; }
  var imported = readHash();
  if (!imported) return false;
  return importCode(imported, imported.code);
}

// One import path for a tapped link and a pasted one. Takes a code or an
// already decoded payload.
function importCode(codeOrResult, rawCode) {
  var imported = typeof codeOrResult === 'string' ? BeastCore.decodePayload(codeOrResult) : codeOrResult;
  var code = typeof codeOrResult === 'string' ? codeOrResult : rawCode;
  if (code && imported && imported.ok) rememberLink(code);

  if (!imported.ok) {
    document.getElementById('root').innerHTML =
      '<div class="wrap"><div class="empty" style="padding-top:80px"><div class="big">' + icon('link') + '</div>' +
      '<h2>That link did not work</h2><p>' + esc(imported.error) + '</p>' +
      '<button class="pbtn" style="margin-top:16px" onclick="render()">Back</button></div></div>';
    return true;
  }
  // A phone waiting for its plan takes whichever kind comes as its first
  // plan: Chris may have sent this client a link before (first-client path).
  var wasWaiting = !!(state && state.waiting);
  // A new plan gets its own check of the welcome on file; any answer still
  // on its way for the plan before is dropped (checkWelcomeOnFile).
  if (imported.kind !== 'ask') { welcomeCheck = null; welcomeCheckSeq++; }
  if (imported.kind === 'ask') startIntake(imported.data);
  else if (imported.kind === 'setup' || !state || wasWaiting) applySetup(imported.data);
  else if (imported.kind === 'plan') applyPlanUpdate(imported.data);
  // An intake link opened here and never touched: the client went to the
  // home screen and answered there (first-client path, 4a). Left in place it
  // would outrank the plan with a spent link, so a plan retires it.
  if (imported.kind !== 'ask' && intake && intake.token && !intake.sent && !answeredAnything()) clearIntakeSilently();

  if (wasWaiting && imported.kind !== 'ask') tab = 'today';
  render();
  if (imported.kind === 'plan' && !wasWaiting) toast('Plan updated');
  return true;
}

// A link tapped while this page is already open changes the hash without
// reloading, so boot never runs again. Without this the client taps Chris's
// new link and nothing happens.
window.addEventListener('hashchange', function () {
  if (/[#&](import|intake)=/.test(location.hash)) handleImport();
});

function boot() {
  applyPrefs();
  load();
  loadIntake();
  // A plan supersedes the texted-code questionnaire: once Chris has sent the
  // plan, that form has done its job. A form from an intake link, or the
  // routine asked again, carries on beside the plan.
  if (state && intake && !intake.token && !intake.routineOnly && !intake.update && !intake.sent) clearIntakeSilently();
  if (!handleImport()) render();
  if (sharingOn()) sendStatus();
  // In the iPhone app a tapped link arrives here instead of in the address.
  if (isNativeApp()) BeastNative.onLink(openLinkText);
}
// The iPhone app first reads back what iOS kept (native.js); the web boots
// at once.
if (isNativeApp()) BeastNative.ready.then(boot); else boot();

// The iPhone app's web view runs no service worker: its files are already
// on the phone.
if ('serviceWorker' in navigator && !isNativeApp()) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {
      // No worker means no offline. The app still works, so this is quiet.
    });
  });
}

function clearIntakeSilently() {
  try { localStorage.removeItem(INTAKE_KEY); } catch (e) {}
  intake = null;
}
</script>
