<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beast Mode">
<title>Beast Mode</title>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
  --accent: #3b82f6; --accent2: #8b5cf6;
  --green: #22c55e; --orange: #f59e0b; --red: #ef4444;
  --text: #f1f5f9; --text2: #94a3b8; --border: #475569;
  --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
h1, h2, h3 { margin: 0; font-weight: 700; }
ul { margin: 6px 0; padding-left: 20px; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; }
input, select, textarea {
  font: inherit; background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; width: 100%;
}
input:disabled { opacity: .6; }

/* ── shell ─────────────────────────────────────────────────────────────── */
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 96px; }
header {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  border-bottom: 1px solid var(--surface2);
}
header .wrap { padding-top: 14px; padding-bottom: 10px; }
.hrow { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%; background: var(--surface2);
  display: grid; place-items: center; font-size: 22px; flex: 0 0 auto;
}
.hname { font-size: 18px; font-weight: 700; line-height: 1.2; }
.hsub { font-size: 12px; color: var(--text2); }

/* ── tabs ──────────────────────────────────────────────────────────────── */
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; background: var(--surface); border-top: 1px solid var(--surface2);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; background: none; color: var(--text2); padding: 10px 4px 12px;
  font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border-radius: 0;
}
nav button .ic { font-size: 18px; line-height: 1.2; }
nav button.active { color: var(--accent); }

/* ── stats ─────────────────────────────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.stat { background: var(--surface); border-radius: var(--radius); padding: 13px; text-align: center; }
.stat b { display: block; font-size: 24px; color: var(--accent); line-height: 1.1; }
.stat.flame b { color: var(--orange); }
.stat span { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; }

.rankcard { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.rankrow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 9px; }
.rankname { font-size: 17px; font-weight: 700; color: var(--accent2); }
.ranknext { font-size: 12px; color: var(--text2); text-align: right; }
.bar { height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

/* ── cards ─────────────────────────────────────────────────────────────── */
.card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.card h3 { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }

.group-label {
  font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em;
  margin: 18px 0 8px;
}

.item {
  display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;
  background: var(--surface); border-radius: var(--radius);
  padding: 13px; margin-bottom: 8px; border-left: 3px solid transparent;
}
.item.core { border-left-color: var(--orange); }
.item.done { background: #14532d44; border-left-color: var(--green); }
.tick {
  width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 7px;
  flex: 0 0 auto; display: grid; place-items: center; background: none;
  color: transparent; font-size: 15px; margin-top: 1px; padding: 0;
}
.item.done .tick { background: var(--green); border-color: var(--green); color: #052e16; }
.ibody { flex: 1; min-width: 0; cursor: pointer; }
.iname { font-weight: 600; line-height: 1.3; }
.item.done .iname { color: var(--text2); }
.imeta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.tag {
  display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px;
  padding: 1px 6px; margin-left: 6px; vertical-align: 1px;
  background: var(--surface2); color: var(--text2); text-transform: uppercase;
}
.tag.core { background: #7c2d12; color: #fed7aa; }
.tag.late { background: #7f1d1d; color: #fecaca; }
.tag.ontime { background: #14532d; color: #bbf7d0; }
.inotes { font-size: 13px; color: var(--text2); margin-top: 6px; font-style: italic; }
.logbtn { background: var(--surface2); color: var(--text2); font-size: 12px; padding: 5px 9px; }
.vwrap { flex-basis: 100%; margin-top: 8px; }
.values { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.values label { font-size: 11px; color: var(--text2); flex: 1; min-width: 76px; }
.values input { margin-top: 3px; padding: 6px 8px; }

.empty { text-align: center; color: var(--text2); padding: 34px 16px; }
.empty .big { font-size: 40px; margin-bottom: 8px; }
.empty h2 { color: var(--text); }

/* ── week ──────────────────────────────────────────────────────────────── */
.daypick { display: flex; gap: 5px; margin: 16px 0; }
.daypick button {
  flex: 1; background: var(--surface); color: var(--text2); padding: 8px 2px;
  font-size: 10px; line-height: 1.3; border: 2px solid transparent;
}
.daypick button .dn { display: block; font-size: 15px; font-weight: 700; color: var(--text); }
.daypick button.sel { border-color: var(--accent); }
.daypick button.closed { background: #14532d88; }
.daypick button.broken { background: #7f1d1d66; }
.daypick button.future { opacity: .4; }

.weekgrid { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
.weekgrid th { font-size: 10px; color: var(--text2); text-transform: uppercase; padding: 6px 3px; font-weight: 600; }
.weekgrid th.nm, .weekgrid td.nm { text-align: left; max-width: 240px; }
.weekgrid td { padding: 4px 3px; border-top: 1px solid var(--surface2); text-align: center; }
.weekgrid .cell {
  width: 30px; height: 30px; border-radius: 7px; background: var(--surface2);
  color: transparent; font-size: 14px; margin: 0 auto; display: grid; place-items: center;
  cursor: pointer;
}
.weekgrid .cell.done { background: var(--green); color: #052e16; }
.weekgrid .cell.off, .weekgrid .cell.future { background: #33415544; cursor: default; }

/* ── goals ─────────────────────────────────────────────────────────────── */
.goal { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
.goal .tick { width: 22px; height: 22px; font-size: 13px; border-radius: 6px; }
.goal.done .tick { background: var(--green); border-color: var(--green); color: #052e16; }
.goal.done .gtext { color: var(--text2); }

/* ── modal ─────────────────────────────────────────────────────────────── */
.modal {
  position: fixed; inset: 0; z-index: 60; background: #000b;
  display: flex; align-items: center; justify-content: center; padding: 18px; overflow-y: auto;
}
.modal > div { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 460px; width: 100%; }
.modal h2 { font-size: 20px; margin-bottom: 6px; }
.modal p { color: var(--text2); font-size: 14px; }
.btn { background: var(--accent); color: #fff; padding: 13px; width: 100%; font-weight: 700; margin-top: 14px; }
.btn.danger { background: var(--red); }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.avatars { display: flex; gap: 8px; flex-wrap: wrap; }
.avatars button { width: 44px; height: 44px; font-size: 22px; background: var(--surface2); border: 2px solid transparent; }
.avatars button.sel { border-color: var(--accent); }

.install {
  background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius);
  padding: 13px; margin: 14px 0; display: flex; gap: 12px; align-items: center;
}
.install .ico { font-size: 26px; flex: 0 0 auto; }
.install .txt { flex: 1; min-width: 0; font-size: 13px; }
.install .txt b { display: block; font-size: 15px; margin-bottom: 2px; }
.install button { background: var(--accent); color: #fff; padding: 8px 12px; font-size: 13px; font-weight: 600; flex: 0 0 auto; }
.install button.x { background: none; color: var(--text2); padding: 8px; }

.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: var(--green); color: #052e16; font-weight: 700; font-size: 14px;
  padding: 10px 18px; border-radius: 999px; z-index: 70; opacity: 0;
  transition: opacity .2s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

.confetti { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; width: 9px; height: 9px; top: -14px; animation: fall 2.4s linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(680deg); opacity: 0; } }

@media (min-width: 769px) { .daypick { display: none; } }
@media (max-width: 768px) { .weekgrid { display: none; } }
@media (max-width: 480px) {
  .wrap { padding-left: 12px; padding-right: 12px; }
  .stat b { font-size: 20px; }
}
</style>
</head>
<body>

<div id="root"></div>
<div id="sheet"></div>
<div id="toast" class="toast"></div>

<script src="lz-string.min.js"></script>
<script src="beast-core.js"></script>
<script>
'use strict';

/* Beast Mode client app.

   All contract logic lives in BeastCore: log keys, scoring, metric names,
   timings, frequencies and payload prefixes are never written inline here.
   See CLAUDE.md. */

var BUILT_AGAINST = '2.7.0';
var KEY = 'bm2.client';
var AVATARS = ['\u{1F4AA}', '\u{1F525}', '\u{1F98D}', '\u{1F3CB}', '\u{1F3AF}', '⚡', '\u{1F43A}', '\u{1F680}'];

var state = null;
var tab = 'today';
var pickedDay = null;     // week tab, mobile day picker
var openValues = {};      // itemId -> true while its value inputs are showing

/* ── storage ───────────────────────────────────────────────────────────── */

function load() {
  try {
    state = JSON.parse(localStorage.getItem(KEY) || 'null');
  } catch (e) { state = null; }
  if (state) {
    state.items = BeastCore.normalizeItems(state.items);
    state.goals = BeastCore.normalizeGoals(state.goals);
    state.log = state.log || {};
    state.profile = state.profile || {};
    state.weightLog = state.weightLog || {};
    state.seen = state.seen || [];
    if (!state.perfectWeek) state.perfectWeek = BeastCore.perfectWeek(state.items);
  }
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { /* private mode or full quota: the session keeps working in memory */ }
}

/* ── import ────────────────────────────────────────────────────────────── */

function readHash() {
  var m = /[#&]import=([^&]+)/.exec(location.hash);
  if (!m) return null;
  var res = BeastCore.decodePayload(decodeURIComponent(m[1]));
  history.replaceState(null, '', location.pathname + location.search);
  return res;
}

/* ── intake questionnaire ──────────────────────────────────────────────── */

var INTAKE_KEY = 'bm2.intake';
var intake = null;   // { clientName, step, answers, code }

function loadIntake() {
  try { intake = JSON.parse(localStorage.getItem(INTAKE_KEY) || 'null'); }
  catch (e) { intake = null; }
}

function saveIntake() {
  // A half-finished form survives a closed tab. The answers stay on the phone
  // until the client chooses to send them.
  try { localStorage.setItem(INTAKE_KEY, JSON.stringify(intake)); } catch (e) {}
}

function startIntake(data) {
  intake = { clientName: (data.profile && data.profile.name) || data.name || '',
             step: 0, answers: {}, code: null };
  saveIntake();
}

function setAnswer(key, value) { intake.answers[key] = value; saveIntake(); }

function intakeStep(delta) {
  var total = BeastCore.INTAKE_SECTIONS.length;
  intake.step = Math.max(0, Math.min(total - 1, intake.step + delta));
  saveIntake();
  window.scrollTo(0, 0);
  render();
}

function submitIntake() {
  intake.code = BeastCore.encodePayload('intake', {
    name: intake.clientName, answers: intake.answers
  });
  saveIntake();
  render();
}

function clearIntake() {
  try { localStorage.removeItem(INTAKE_KEY); } catch (e) {}
  intake = null;
  render();
}

function jsq(s) { return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'"; }

function intakeMsg() {
  return 'Beast Mode intake for ' + (intake.clientName || 'me') + ':\n\n' + intake.code;
}

function copyIntake() {
  if (navigator.clipboard) navigator.clipboard.writeText(intake.code).then(function () { toast('Copied'); });
  else toast('Select the code below and copy it');
}

function shareIntake() {
  if (navigator.share) navigator.share({ text: intakeMsg() }).catch(function () {});
  else copyIntake();
}

function intakeScreen() {
  if (intake.code) {
    return '<div class="wrap"><div class="card" style="margin-top:30px">' +
      '<h2 style="font-size:20px;margin-bottom:8px">Done. Send it to Chris.</h2>' +
      '<p class="imeta">He loads this and builds your plan.</p>' +
      '<button class="btn" onclick="copyIntake()">Copy the code</button>' +
      '<button class="btn" style="background:var(--surface2)" onclick="location.href=' +
        jsq('sms:?&body=' + encodeURIComponent(intakeMsg())) + '">Text it to Chris</button>' +
      '<button class="btn" style="background:var(--surface2)" onclick="shareIntake()">Share</button>' +
      '<div class="inotes" style="word-break:break-all;margin-top:14px">' + esc(intake.code) + '</div>' +
      '<button class="btn" style="background:var(--surface2)" onclick="clearIntake()">Start over</button>' +
      '</div></div>';
  }

  var secs = BeastCore.INTAKE_SECTIONS;
  var sec = secs[intake.step];
  var last = intake.step === secs.length - 1;

  var fields = sec.fields.map(function (f) {
    var v = intake.answers[f.key] == null ? '' : intake.answers[f.key];
    var on = 'onchange="setAnswer(\'' + attr(f.key) + '\',this.value)"';
    var input;
    if (f.type === 'textarea') {
      input = '<textarea rows="3" ' + on + '>' + esc(v) + '</textarea>';
    } else if (f.type === 'select') {
      input = '<select ' + on + '><option value="">Pick one</option>' +
        f.options.map(function (o) {
          return '<option value="' + attr(o) + '"' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
    } else {
      input = '<input type="' + (f.type === 'number' ? 'number' : 'text') + '"' +
        (f.type === 'number' ? ' inputmode="decimal"' : '') +
        ' value="' + attr(v) + '" ' + on + '>';
    }
    return '<div class="field"><label>' + esc(f.label) + '</label>' + input +
      (f.hint ? '<div class="imeta">' + esc(f.hint) + '</div>' : '') + '</div>';
  }).join('');

  return '<div class="wrap">' +
    '<div style="margin:22px 0 4px"><div class="imeta">Step ' + (intake.step + 1) + ' of ' + secs.length + '</div>' +
      '<div class="bar" style="margin-top:8px"><i style="width:' +
        Math.round(((intake.step + 1) / secs.length) * 100) + '%"></i></div></div>' +
    '<div class="card" style="margin-top:16px">' +
      '<h2 style="font-size:20px;margin-bottom:4px">' + esc(sec.title) + '</h2>' +
      (sec.hint ? '<p class="imeta" style="margin-bottom:12px">' + esc(sec.hint) + '</p>' : '<div style="height:10px"></div>') +
      fields +
      '<button class="btn" onclick="' + (last ? 'submitIntake()' : 'intakeStep(1)') + '">' +
        (last ? 'Send to Chris' : 'Next') + '</button>' +
      (intake.step > 0 ? '<button class="btn" style="background:var(--surface2)" onclick="intakeStep(-1)">Back</button>' : '') +
    '</div></div>';
}

function applySetup(data) {
  state = {
    v: BeastCore.PAYLOAD_VERSION,
    items: data.items || [],
    goals: data.goals || [],
    profile: data.profile || {},
    log: {},
    perfectWeek: BeastCore.perfectWeek(data.items || []),
    earnedLevel: 1,
    goalsAgreedAt: null,
    weightLog: {},
    seen: []
  };
  save();
}

/* A plan update keeps everything the client has done. Items already present
   keep their addedAt, so history and streak survive; genuinely new items are
   stamped with today and never reach backwards into closed days. */
function applyPlanUpdate(data) {
  var byId = {};
  state.items.forEach(function (it) { byId[it.id] = it; });

  state.items = (data.items || []).map(function (incoming) {
    var prev = byId[incoming.id];
    return BeastCore.normalizeItem(
      Object.assign({}, incoming, { addedAt: prev ? prev.addedAt : BeastCore.todayLocal() })
    );
  });

  if (data.goals && data.goals.length) {
    var completed = {};
    state.goals.forEach(function (g) { completed[g.id] = g.completed; });
    state.goals = data.goals.map(function (g) {
      return Object.assign({}, g, { completed: !!completed[g.id] });
    });
  }

  // Fill blanks without overwriting anything the client set themselves.
  var incomingProfile = data.profile || {};
  Object.keys(incomingProfile).forEach(function (k) {
    var cur = state.profile[k];
    if (cur === undefined || cur === '' || cur === null) state.profile[k] = incomingProfile[k];
  });

  save();
}

/* ── goal agreement ────────────────────────────────────────────────────── */

function agreeToGoals() {
  var today = BeastCore.todayLocal();
  state.goalsAgreedAt = new Date().toISOString();
  state.profile.startDate = today;
  // Agreement starts the clock, so every item dates from here and the ladder
  // is snapshotted against the plan as agreed.
  state.items = state.items.map(function (it) {
    return Object.assign({}, it, { addedAt: today });
  });
  state.perfectWeek = BeastCore.perfectWeek(state.items);
  save();
  render();
  toast('Day one starts now');
  confetti();
}

/* ── actions ───────────────────────────────────────────────────────────── */

function findItem(id) {
  for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
  return null;
}

function toggleItem(id, date) {
  var it = findItem(id);
  if (!it || date > BeastCore.todayLocal()) return;
  var was = BeastCore.isDone(state.log, id, date);
  var prev = BeastCore.entryFor(state.log, id, date);
  BeastCore.markDone(state.log, it, date, !was, prev && prev.values);
  save();
  if (remindersOn()) writeMirror();
  checkMilestones();
  render();
}

function setValue(id, date, field, raw) {
  var e = BeastCore.entryFor(state.log, id, date);
  if (!e) return;
  e.values = e.values || {};
  if (raw === '') delete e.values[field];
  else e.values[field] = isNaN(Number(raw)) ? raw : Number(raw);
  save();
}

function toggleValues(id) { openValues[id] = !openValues[id]; render(); }

function toggleGoal(id) {
  state.goals = state.goals.map(function (g) {
    return g.id === id ? Object.assign({}, g, { completed: !g.completed }) : g;
  });
  save();
  render();
}

function saveProfile() {
  var w = document.getElementById('p-weight');
  if (w && w.value !== '') {
    state.profile.weight = Number(w.value);
    state.weightLog[BeastCore.todayLocal()] = Number(w.value);
  }
  save();
  toast('Saved');
  render();
}

function pickAvatar(a) { state.profile.avatar = a; save(); render(); }

function resetAll() {
  if (!confirm('This erases your plan and everything you have logged. You will need a new link from Chris. Continue?')) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  state = null;
  tab = 'today';
  render();
}

function go(t) { tab = t; window.scrollTo(0, 0); render(); }
function pickDay(d) { pickedDay = d; render(); }

/* ── feedback ──────────────────────────────────────────────────────────── */

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 1900);
}

function confetti() {
  var box = document.createElement('div');
  box.className = 'confetti';
  var colors = ['#3b82f6', '#8b5cf6', '#22c55e', '#f59e0b'];
  for (var i = 0; i < 40; i++) {
    var p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function () { box.remove(); }, 3200);
}

function progress() {
  var p = BeastCore.progress(state.items, state.log, {
    today: BeastCore.todayLocal(),
    perfectWeek: state.perfectWeek,
    earnedLevel: state.earnedLevel
  });
  if (p.level.level > (state.earnedLevel || 1)) { state.earnedLevel = p.level.level; save(); }
  return p;
}

function checkMilestones() {
  var p = progress();
  var marks = [
    { id: 'lvl' + p.level.level, hit: p.level.level > 1, msg: p.level.rank + '!' },
    { id: 'streak7', hit: p.streak >= 7, msg: '7 day streak' },
    { id: 'streak30', hit: p.streak >= 30, msg: '30 day streak' }
  ];
  marks.forEach(function (m) {
    if (m.hit && state.seen.indexOf(m.id) === -1) {
      state.seen.push(m.id);
      save();
      toast(m.msg);
      confetti();
    }
  });
}

/* ── send my day ───────────────────────────────────────────────────────── */

function openSendDay() {
  var today = BeastCore.todayLocal();
  var d = BeastCore.dayResult(state.items, state.log, today);
  var prev = (state.sentDays || {})[today];
  showSheet(
    '<h2 style="font-size:20px;margin-bottom:4px">Send Chris your day</h2>' +
    '<p class="imeta">' + d.completed + ' done, ' + dayPct(today) + '% of what was due.' +
      (prev ? ' Already sent once today; this replaces it.' : '') + '</p>' +
    '<div class="field" style="margin-top:14px"><label>One thing you are grateful for today</label>' +
      '<input id="gratitude" value="' + attr((state.gratitude || {})[today] || '') +
      '" placeholder="Keep it short"></div>' +
    '<button class="btn" onclick="sendDay()">Make the report</button>' +
    '<button class="btn" style="background:var(--surface2)" onclick="closeSheet()">Not yet</button>'
  );
}

function sendDay() {
  var today = BeastCore.todayLocal();
  var g = (document.getElementById('gratitude') || {}).value || '';
  state.gratitude = state.gratitude || {};
  state.gratitude[today] = g.trim();

  var p = progress();
  var report = BeastCore.buildReport(state.items, state.log, today, {
    name: state.profile.name, gratitude: g,
    points: p.points, streak: p.streak, rank: p.level.rank
  });
  var code = BeastCore.encodePayload('report', report);
  var msg = (state.profile.name || 'Me') + ' - ' + today + '\n' +

    p.streak + ' day streak' + (g.trim() ? '\nGrateful for: ' + g.trim() : '') + '\n\n' + code;

  state.sentDays = state.sentDays || {};

  showSheet(
    '<h2 style="font-size:20px;margin-bottom:4px">Ready to send</h2>' +
    '<p class="imeta">Tap one of these and it goes to Chris.</p>' +

    '<button class="btn" style="background:var(--surface2)" onclick="shareDay(' + jsq(msg) + ')">Share</button>' +
    '<button class="btn" style="background:var(--surface2)" onclick="copyDay(' + jsq(code) + ')">Copy the code</button>' +
    '<button class="btn" style="background:var(--surface2)" onclick="closeSheet()">Done</button>'
  );
}

function shareDay(msg) {

function copyDay(t) {

function showSheet(html) {

/* ── reminders ─────────────────────────────────────────────────────────── */

// Set after you deploy the worker. Empty means reminders stay switched off,
// so the app works fine for anyone who never sets this up.
var PUSH_URL = 'https://beast-mode-push.brofessor.workers.dev';
var VAPID_PUBLIC_KEY = 'BDpOB42o2rDOh6fd0DrTSWRm7rj6LUu3IKcX51r9yA1JOGJEefM1d3PjWek2o3ju9xk7Vyt2vUuzocjqwxFPusE';

var IDB = 'bm2', IDB_STORE = 'reminders';

function idb() {
  return new Promise(function (resolve, reject) {
    var open = indexedDB.open(IDB, 1);
    open.onupgradeneeded = function () {
      if (!open.result.objectStoreNames.contains(IDB_STORE)) open.result.createObjectStore(IDB_STORE);
    };
    open.onsuccess = function () { resolve(open.result); };
    open.onerror = function () { reject(open.error); };
  });
}

// The service worker cannot read localStorage, so today's reminder text is
// mirrored into IndexedDB where the push handler can reach it. Only what a
// notification needs goes in, and it never leaves the device.
function writeMirror() {
  var today = BeastCore.todayLocal();
  var due = BeastCore.reminderSlots(state.items).map(function (slot) {
    var items = BeastCore.dueAtSlot(state.items, state.log, today, slot);
    return { date: today, slot: slot, text: BeastCore.reminderText(items, slot) };
  }).filter(function (r) { return r.text; });

  return idb().then(function (db) {
    return new Promise(function (resolve) {
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({ due: due, writtenAt: new Date().toISOString() }, 'current');
      tx.oncomplete = function () { resolve(due.length); };
      tx.onerror = function () { resolve(0); };
    });
  }).catch(function () { return 0; });
}

function urlB64ToUint8(s) {
  var pad = (s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(pad);
  return Uint8Array.from(raw, function (c) { return c.charCodeAt(0); });
}

function remindersOn() { return !!(state.reminders && state.reminders.on); }
function pushConfigured() { return !!(PUSH_URL && VAPID_PUBLIC_KEY); }

async function enableReminders() {
  if (!pushConfigured()) { toast('Reminders are not set up yet'); return; }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('This browser cannot do reminders'); return;
  }
  if (isIOS() && !isStandalone()) {
    toast('Add Beast Mode to your home screen first'); return;
  }

  var perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Reminders need notification permission'); return; }

  try {
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY)
    });
    state.reminders = state.reminders || {};
    state.reminders.on = true;
    state.reminders.id = state.reminders.id || BeastCore.newId();
    state.reminders.quiet = state.reminders.quiet || { from: '22:00', to: '07:00' };
    save();

    await syncReminders(sub);
    await writeMirror();
    toast('Reminders on');
  } catch (e) {
    toast('Could not turn reminders on');
  }
  render();
}

function syncReminders(sub) {
  return fetch(PUSH_URL + '/subscribe', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      id: state.reminders.id,
      sub: { endpoint: sub.endpoint },
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      slots: BeastCore.reminderSlots(state.items),
      quiet: state.reminders.quiet
    })
  }).catch(function () {});
}

async function disableReminders() {
  try {
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
    if (PUSH_URL && state.reminders && state.reminders.id) {
      await fetch(PUSH_URL + '/unsubscribe', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: state.reminders.id })
      }).catch(function () {});
    }
  } catch (e) { /* the subscription may already be gone */ }
  state.reminders = state.reminders || {};
  state.reminders.on = false;
  save();
  toast('Reminders off');
  render();
}

function setQuiet(which, value) {
  state.reminders = state.reminders || {};
  state.reminders.quiet = state.reminders.quiet || { from: '22:00', to: '07:00' };
  state.reminders.quiet[which] = value;
  save();
  if (remindersOn()) navigator.serviceWorker.ready.then(function (reg) {
    return reg.pushManager.getSubscription().then(function (sub) { if (sub) syncReminders(sub); });
  });
}

function remindersCard() {
  var slots = BeastCore.reminderSlots(state.items);
  if (!pushConfigured()) {
    return '<div class="card"><h3>Reminders</h3>' +
      '<p class="imeta">Not set up yet.</p></div>';
  }
  if (!slots.length) {
    return '<div class="card"><h3>Reminders</h3>' +
      '<p class="imeta">Nothing on your plan has a due-by time, so there is nothing to remind you about.</p></div>';
  }
  var q = (state.reminders && state.reminders.quiet) || { from: '22:00', to: '07:00' };
  return '<div class="card"><h3>Reminders</h3>' +
    '<p class="imeta">' + slots.map(function (s) { return BeastCore.formatDueBy(s); }).join(', ') +
      '. Only what is still outstanding gets a nudge.</p>' +
    (isIOS() && !isStandalone()
      ? '<p class="imeta">On iPhone, add Beast Mode to your home screen first.</p>' : '') +
    (remindersOn()
      ? '<div class="values"><label>Quiet from<input value="' + attr(q.from) +
          '" onchange="setQuiet(\'from\',this.value)"></label>' +
        '<label>until<input value="' + attr(q.to) + '" onchange="setQuiet(\'to\',this.value)"></label></div>' +
        '<button class="btn" style="background:var(--surface2)" onclick="disableReminders()">Turn reminders off</button>'
      : '<button class="btn" onclick="enableReminders()">Turn reminders on</button>') +
    '</div>';
}

/* ── install ───────────────────────────────────────────────────────────── */

var deferredPrompt = null;
var DISMISS_KEY = 'bm2.installDismissed';

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

function installDismissed() {
  try { return localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
}

function dismissInstall() {
  try { localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
  render();
}

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredPrompt = e;
  render();
});

window.addEventListener('appinstalled', function () {
  deferredPrompt = null;
  render();
});

function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function () { deferredPrompt = null; render(); });
}

function installCard() {
  if (isStandalone() || installDismissed()) return '';

  // iOS has no install prompt event. Adding to the home screen is a manual
  // Share then Add to Home Screen, and on iOS it is also the only way to get
  // reminders later, so the instructions are worth showing.
  if (isIOS()) {
    return '<div class="install"><div class="ico">\u{1F4F1}</div>' +
      '<div class="txt"><b>Put this on your home screen</b>' +
      'Tap Share at the bottom of Safari, then Add to Home Screen.</div>' +
      '<button class="x" onclick="dismissInstall()">✕</button></div>';
  }
  if (!deferredPrompt) return '';
  return '<div class="install"><div class="ico">\u{1F4F1}</div>' +
    '<div class="txt"><b>Install Beast Mode</b>Opens straight to your list, works without signal.</div>' +
    '<button onclick="doInstall()">Install</button>' +
    '<button class="x" onclick="dismissInstall()">✕</button></div>';
}

/* ── rendering ─────────────────────────────────────────────────────────── */

function esc(s) { return BeastCore.escapeHtml(s); }
function attr(s) { return BeastCore.escHTMLAttr(s); }

function render() {
  var root = document.getElementById('root');

  if (BeastCore.VERSION !== BUILT_AGAINST) {
    root.innerHTML = '<div class="wrap"><div class="empty" style="padding-top:80px">' +
      '<div class="big">\u{1F504}</div><h2>Beast Mode was updated</h2>' +
      '<p>Close this page and open it again to get the new version.</p></div></div>';
    return;
  }
  // A questionnaire in progress outranks everything: the client has not been
  // sent a plan yet, so there is nothing else for them to look at.
  if (intake && !state) { root.innerHTML = intakeScreen(); return; }
  if (!state) { root.innerHTML = setupScreen(); return; }
  if (!state.goalsAgreedAt) { root.innerHTML = agreementScreen(); return; }

  root.innerHTML = header() + '<div class="wrap">' +
    (tab === 'today' ? todayTab() : tab === 'week' ? weekTab() : profileTab()) +
    '</div>' + navBar();
}

function setupScreen() {
  return '<div class="wrap"><div class="empty" style="padding-top:80px">' +
    '<div class="big">\u{1F4AA}</div><h2>Beast Mode</h2>' +
    '<p style="margin-top:10px">No plan on this phone yet.<br>Open the link Chris sent you to get started.</p>' +
    '</div></div>';
}

function agreementScreen() {

  };
  return '<div class="modal"><div>' +
    '<h2>Your goals</h2><p>Agreeing starts the clock. Day one is today.</p>' +

    '<p style="margin-top:16px">' + state.items.length + ' items on your list. ' +

function header() {
  var p = state.profile;
  var day = BeastCore.daysBetween(p.startDate || BeastCore.todayLocal(), BeastCore.todayLocal()) + 1;
  return '<header><div class="wrap"><div class="hrow">' +

function navBar() {
  var tabs = [['today', '✓', 'Today'], ['week', '\u{1F4C5}', 'Week'], ['profile', '\u{1F464}', 'Profile']];
  return '<nav>' + tabs.map(function (t) {
    return '<button class="' + (tab === t[0] ? 'active' : '') + '" onclick="go(\'' + t[0] + '\')">' +
      '<span class="ic">' + t[1] + '</span>' + t[2] + '</button>';
  }).join('') + '</nav>';
}

function todayTab() {
  var today = BeastCore.todayLocal();
  var p = progress();
  var tiers = BeastCore.levelThresholds(state.perfectWeek);
  var next = tiers.filter(function (t) { return t.points > p.points; })[0];
  var floor = tiers[p.level.level - 1] ? tiers[p.level.level - 1].points : 0;
  var pct = next && next.points > floor
    ? Math.round(((p.points - floor) / (next.points - floor)) * 100) : 100;

  var html = installCard() +
    '<div class="stats">' +
      '<div class="stat"><b>' + p.points + '</b><span>Points</span></div>' +
      '<div class="stat flame"><b>' + p.streak + '</b><span>Streak</span></div>' +
      '<div class="stat"><b>' + dayPct(today) + '%</b><span>Today</span></div>' +
    '</div>' +
    '<div class="rankcard"><div class="rankrow">' +
      '<span class="rankname">' + esc(p.level.rank) + '</span>' +
      '<span class="ranknext">' +
        (next ? (next.points - p.points) + ' to ' + esc(next.rank) : 'Top rank') +
      '</span></div>' +
      '<div class="bar"><i style="width:' + Math.max(2, Math.min(100, pct)) + '%"></i></div></div>';

  var open = state.goals.filter(function (g) { return !g.completed; });
  if (open.length) {
    html += '<div class="card"><h3>Working toward</h3>' +
      open.slice(0, 3).map(function (g) { return '<div class="imeta">' + esc(g.text) + '</div>'; }).join('') +
      '</div>';
  }

  html += itemList(today);

  // The send button sits under the list: the day is reviewed before it is sent.
  var sentAt = (state.sentDays || {})[today];
  html += '<button class="btn" style="margin-top:6px' +
    (sentAt ? ';background:var(--surface2)' : '') + '" onclick="openSendDay()">' +
    (sentAt ? 'Sent today. Send again?' : 'Send Chris my day') + '</button>';
  return html;
}

function dayPct(date) {
  var due = state.items.filter(function (it) { return BeastCore.isScheduled(it, date); });
  if (!due.length) return 100;
  var done = due.filter(function (it) { return BeastCore.isDone(state.log, it.id, date); }).length;
  return Math.round((done / due.length) * 100);
}

function itemList(date) {
  var due = state.items.filter(function (it) { return BeastCore.isAvailable(it, date); });
  if (!due.length) {
    return '<div class="empty"><div class="big">\u{1F634}</div><p>Nothing on the list for this day.</p></div>';
  }
  // Groups follow plan order, so a push day reads top to bottom.
  var groups = [];
  due.forEach(function (it) {
    var g = groups.filter(function (x) { return x.name === it.group; })[0];
    if (!g) { g = { name: it.group, items: [] }; groups.push(g); }
    g.items.push(it);
  });

  return groups.map(function (g) {
    return (g.name ? '<div class="group-label">' + esc(g.name) + '</div>' : '') +
      g.items.map(function (it) { return itemCard(it, date); }).join('');
  }).join('');
}

function itemCard(it, date) {
  var e = BeastCore.entryFor(state.log, it.id, date);
  var done = !!(e && e.done);
  var onTime = done && BeastCore.isOnTime(it, e, date);
  var target = BeastCore.formatTarget(it.detail);
  var fields = BeastCore.usesMetric(it.kind) ? BeastCore.targetFields(it.detail.metric) : [];

  var meta = [esc(it.kind)];
  if (it.dueBy) meta.push('by ' + esc(BeastCore.formatDueBy(it.dueBy)));
  var line = BeastCore.detailLine(it);
  if (line) meta.push(esc(line));

  var tags = (it.core ? '<span class="tag core">core</span>' : '') +
    (done ? (onTime ? '<span class="tag ontime">on time</span>' : '<span class="tag late">late</span>') : '');

  var values = '';
  if (done && fields.length) {
    values = '<div class="vwrap"><button class="logbtn" onclick="toggleValues(\'' + attr(it.id) + '\')">' +
      (openValues[it.id] ? 'Hide' : 'Log what you did') + '</button>';
    if (openValues[it.id]) {
      values += '<div class="values">' + fields.map(function (f) {
        var v = (e.values && e.values[f.key] != null) ? e.values[f.key] : '';
        return '<label>' + esc(f.label) +
          '<input type="number" inputmode="decimal" value="' + attr(v) + '" ' +
          'onchange="setValue(\'' + attr(it.id) + '\',\'' + attr(date) + '\',\'' + attr(f.key) + '\',this.value)"></label>';
      }).join('') + '</div>';
    }
    values += '</div>';
  }

  var tap = 'toggleItem(\'' + attr(it.id) + '\',\'' + attr(date) + '\')';
  return '<div class="item' + (done ? ' done' : '') + (it.core ? ' core' : '') + '">' +
    '<button class="tick" onclick="' + tap + '" aria-label="' +
      (done ? 'Undo ' : 'Complete ') + attr(it.name) + '">✓</button>' +
    '<div class="ibody" onclick="' + tap + '">' +
      '<div class="iname">' + esc(it.name) + tags + '</div>' +
      '<div class="imeta">' + meta.join(' · ') + '</div>' +
      (it.notes ? '<div class="inotes">' + esc(it.notes) + '</div>' : '') +
    '</div>' + values + '</div>';
}

function weekTab() {
  var today = BeastCore.todayLocal();
  var week = BeastCore.getWeekDates(today);
  var sel = (pickedDay && week.indexOf(pickedDay) !== -1) ? pickedDay : today;

  var picker = '<div class="daypick">' + week.map(function (d, i) {
    var cls = d > today ? 'future' : BeastCore.dayResult(state.items, state.log, d).gate;
    return '<button class="' + cls + (d === sel ? ' sel' : '') + '" onclick="pickDay(\'' + d + '\')">' +
      BeastCore.DAYS[i] + '<span class="dn">' + d.slice(8) + '</span></button>';
  }).join('') + '</div>';

  var rows = state.items.map(function (it) {
    var cells = week.map(function (d) {
      if (!BeastCore.isAvailable(it, d)) return '<td><div class="cell off"></div></td>';
      if (d > today) return '<td><div class="cell future"></div></td>';
      var done = BeastCore.isDone(state.log, it.id, d);
      return '<td><div class="cell' + (done ? ' done' : '') + '" onclick="toggleItem(\'' +
        attr(it.id) + '\',\'' + attr(d) + '\')">✓</div></td>';
    }).join('');
    return '<tr><td class="nm">' + esc(it.name) +
      (it.core ? '<span class="tag core">core</span>' : '') + '</td>' + cells + '</tr>';
  }).join('');

  var grid = '<table class="weekgrid"><thead><tr><th class="nm">Item</th>' +
    week.map(function (d, i) { return '<th>' + BeastCore.DAYS[i] + '<br>' + d.slice(8) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows + '</tbody></table>';

  return picker + grid + itemList(sel);
}

function profileTab() {

  var html = '<div class="card"><h3>You</h3>' +

  html += remindersCard();

  html += '<div class="card"><h3>Danger zone</h3>' +

  return html;

/* ── boot ──────────────────────────────────────────────────────────────── */

function handleImport() {
  var imported = readHash();
  if (!imported) return false;

  if (!imported.ok) {
    document.getElementById('root').innerHTML =
      '<div class="wrap"><div class="empty" style="padding-top:80px"><div class="big">⚠️</div>' +
      '<h2>That link did not work</h2><p>' + esc(imported.error) + '</p></div></div>';
    return true;
  }
  if (imported.kind === 'ask') startIntake(imported.data);
  else if (imported.kind === 'setup' || !state) applySetup(imported.data);
  else if (imported.kind === 'plan') applyPlanUpdate(imported.data);

  render();
  if (imported.kind === 'plan') toast('Plan updated');
  return true;
}

// A link tapped while this page is already open changes the hash without
// reloading, so boot never runs again. Without this the client taps Chris's
// new link and nothing happens.
window.addEventListener('hashchange', function () {
  if (/[#&]import=/.test(location.hash)) handleImport();
});

(function boot() {
  load();
  loadIntake();
  // A plan supersedes a questionnaire: once Chris has sent the plan, the form
  // has done its job.
  if (state && intake) clearIntakeSilently();
  if (!handleImport()) render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {
      // No worker means no offline. The app still works, so this is quiet.
    });
  });
}

function clearIntakeSilently() {
  try { localStorage.removeItem(INTAKE_KEY); } catch (e) {}
  intake = null;
}
</script>
</body>
</html>
